<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Formatter — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:40px 20px}
.container{max-width:900px;margin:auto}
textarea{width:100%;height:350px;padding:20px;background:#111a30;color:#22d3ee;border:1px solid #27304a;border-radius:12px;font-family:monospace}
button{padding:14px 25px;margin-top:15px;background:#7c3aed;color:white;border:0;border-radius:10px;cursor:pointer}
#status{margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h1>{ } JSON Formatter</h1>
<p>Format JSON into readable code.</p>
<textarea id="json" placeholder='{"name":"VexTools"}'></textarea>
<br>
<button onclick="formatJSON()">Format JSON</button>
<button onclick="minify()">Minify</button>
<div id="status"></div>
</div>
<script>
function formatJSON(){
try{
json.value=JSON.stringify(JSON.parse(json.value),null,4);
status.textContent="✓ Valid JSON";
}catch(e){status.textContent="❌ Invalid JSON";}
}
function minify(){
try{json.value=JSON.stringify(JSON.parse(json.value));status.textContent="✓ Minified";}
catch(e){status.textContent="❌ Invalid JSON";}
}
</script>
</body>
</html>
