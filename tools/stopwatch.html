<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#070b18;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 15px;
}

.container{
    width:100%;
    max-width:700px;
    text-align:center;
}

.logo{
    display:inline-block;
    color:#a78bfa;
    font-size:28px;
    font-weight:900;
    text-decoration:none;
    margin-bottom:15px;
}

h1{
    font-size:38px;
    margin-bottom:8px;
}

.description{
    color:#94a3b8;
    margin-bottom:30px;
}

.card{
    background:#111a30;
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:30px 20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

#time{
    font-size:70px;
    font-weight:bold;
    letter-spacing:3px;
    margin:30px 0;
    color:#f8fafc;
    font-variant-numeric:tabular-nums;
}

.buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}

button{
    min-width:130px;
    padding:14px 25px;
    border:0;
    border-radius:10px;
    background:#7c3aed;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.stop{
    background:#dc2626;
}

.reset{
    background:#475569;
}

.info{
    margin-top:25px;
    color:#94a3b8;
    font-size:14px;
    line-height:1.6;
}

@media(max-width:500px){

    h1{
        font-size:30px;
    }

    #time{
        font-size:48px;
        letter-spacing:2px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>

</head>


<body>

<main class="container">

    <a
        class="logo"
        href="../index.html"
        aria-label="VexTools Home"
    >
        VexTools
    </a>

    <h1>Online Stopwatch</h1>

    <p class="description">
        Free online stopwatch to measure elapsed time quickly and accurately.
    </p>


    <section class="card" aria-label="Stopwatch">

        <div
            id="time"
            role="timer"
            aria-live="polite"
        >
            00:00:00
        </div>


        <div class="buttons">

            <button
                type="button"
                onclick="start()"
                aria-label="Start stopwatch"
            >
                ▶ Start
            </button>

            <button
                type="button"
                class="stop"
                onclick="stop()"
                aria-label="Stop stopwatch"
            >
                ■ Stop
            </button>

            <button
                type="button"
                class="reset"
                onclick="reset()"
                aria-label="Reset stopwatch"
            >
                ↻ Reset
            </button>

        </div>


        <p class="info">
            Start the stopwatch to begin measuring time.
            Your timer runs directly in your browser.
        </p>

    </section>

</main>


<script>

let sec = 0;
let timer = null;


function update(){

    const h = Math.floor(sec / 3600);

    const m = Math.floor((sec % 3600) / 60);

    const s = sec % 60;


    document.getElementById("time").textContent =
        [h, m, s]
        .map(x => String(x).padStart(2, "0"))
        .join(":");

}


function start(){

    if(!timer){

        timer = setInterval(() => {

            sec++;

            update();

        }, 1000);

    }

}


function stop(){

    clearInterval(timer);

    timer = null;

}


function reset(){

    stop();

    sec = 0;

    update();

}


update();

</script>

</body>
