<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number to Words — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:50px 20px}
.container{max-width:700px;margin:auto}
input{width:100%;padding:16px;background:#111a30;color:white;border:1px solid #27304a;border-radius:10px;margin:20px 0}
button{padding:14px 25px;background:#7c3aed;color:white;border:0;border-radius:10px}
.result{margin-top:20px;padding:20px;background:#111a30;border-radius:12px}
</style>
</head>
<body>
<div class="container">
<h1>🔢 Number to Words</h1>
<p>Convert numbers into English words.</p>
<input id="number" type="number" placeholder="Enter number">
<button onclick="convert()">Convert</button>
<div class="result" id="result"></div>
</div>

<script>
const ones=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const tens=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

function words(n){
if(n<20)return ones[n];
if(n<100)return tens[Math.floor(n/10)]+(n%10?" "+ones[n%10]:"");
if(n<1000)return ones[Math.floor(n/100)]+" hundred"+(n%100?" "+words(n%100):"");
if(n<1000000)return words(Math.floor(n/1000))+" thousand"+(n%1000?" "+words(n%1000):"");
return "Number too large";
}

function convert(){
let n=Number(number.value);
result.textContent=n>=0&&n<1000000?words(n):"Enter a number from 0 to 999999.";
}
</script>
</body>
</html>
