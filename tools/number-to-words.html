<div class="container">

<h1>🔢 Number to Words</h1>

<p>
Convert numbers into English words.
</p>

<input
id="number"
type="number"
placeholder="Enter number"
>

<button onclick="convert()">
Convert
</button>

<div class="result" id="result">
</div>

</div>

<script>

const ones=[
"",
"one",
"two",
"three",
"four",
"five",
"six",
"seven",
"eight",
"nine",
"ten",
"eleven",
"twelve",
"thirteen",
"fourteen",
"fifteen",
"sixteen",
"seventeen",
"eighteen",
"nineteen"
];

const tens=[
"",
"",
"twenty",
"thirty",
"forty",
"fifty",
"sixty",
"seventy",
"eighty",
"ninety"
];


function words(n){

if(n===0)
return "zero";

if(n<20)
return ones[n];

if(n<100)
return tens[Math.floor(n/10)]
+
(n%10 ? " "+ones[n%10] : "");

if(n<1000)
return ones[Math.floor(n/100)]
+
" hundred"
+
(n%100 ? " "+words(n%100) : "");

if(n<1000000)
return words(Math.floor(n/1000))
+
" thousand"
+
(n%1000 ? " "+words(n%1000) : "");

return "Number too large";

}


function convert(){

let n =
Number(
document.getElementById("number").value
);

const result =
document.getElementById("result");

if(
!Number.isInteger(n) ||
n<0 ||
n>=1000000
){

result.textContent =
"Enter a number from 0 to 999999.";

return;

}

result.textContent =
words(n);

}

</script>
