<body>

<div class="container">

<h1>🔐 Base64 Encoder & Decoder</h1>

<p>
Encode and decode text using Base64 quickly and easily.
</p>


<textarea
id="input"
placeholder="Enter text or Base64..."
aria-label="Base64 input"
></textarea>


<button onclick="encode()">
Encode
</button>


<button onclick="decode()">
Decode
</button>


<textarea
id="output"
placeholder="Result..."
readonly
aria-label="Base64 result"
></textarea>


<div id="status" aria-live="polite"></div>


<a class="back" href="../index.html">
← Back to VexTools
</a>

</div>


<script>

const input =
document.getElementById("input");

const output =
document.getElementById("output");

const status =
document.getElementById("status");


function encode(){

try{

output.value =
btoa(
unescape(
encodeURIComponent(input.value)
)
);

status.textContent =
"✓ Text encoded to Base64 successfully.";

}
catch(error){

output.value = "";

status.textContent =
"❌ Unable to encode the text.";

}

}


function decode(){

try{

output.value =
decodeURIComponent(
escape(
atob(input.value)
)
);

status.textContent =
"✓ Base64 decoded successfully.";

}
catch(error){

output.value = "";

status.textContent =
"❌ Invalid Base64 input.";

}

}

</script>
