<body>

<div class="container">

<h1>🔐 Base64 Encoder & Decoder</h1>

<p class="subtitle">
Encode text to Base64 or decode Base64 back to text quickly and easily.
</p>


<div class="card">

<label for="input">
Input
</label>

<textarea
id="input"
placeholder="Enter text or Base64..."
aria-label="Base64 input"
></textarea>

<div
class="counter"
id="inputCount">
0 characters
</div>


<div class="buttons">

<button onclick="encodeText()">
Encode
</button>

<button onclick="decodeText()">
Decode
</button>

<button
class="secondary"
onclick="swapText()">
⇅ Swap
</button>

<button
class="secondary"
onclick="clearAll()">
Clear
</button>

</div>


<label for="output">
Result
</label>

<textarea
id="output"
placeholder="Result will appear here..."
readonly
aria-label="Base64 result"
></textarea>

<div
class="counter"
id="outputCount">
0 characters
</div>


<div class="buttons">

<button onclick="copyResult()">
📋 Copy Result
</button>

</div>


<div
id="status"
class="status"
aria-live="polite">
</div>

</div>


<a
class="back"
href="../index.html">
← Back to VexTools
</a>

</div>


<script>

const input =
document.getElementById("input");

const output =
document.getElementById("output");

const status =
document.getElementById("status");

const inputCount =
document.getElementById("inputCount");

const outputCount =
document.getElementById("outputCount");


/* Character Counter */

input.addEventListener("input", updateCounters);


function updateCounters(){

inputCount.textContent =
input.value.length +
(input.value.length === 1
? " character"
: " characters");


outputCount.textContent =
output.value.length +
(output.value.length === 1
? " character"
: " characters");

}


/* Encode */

function encodeText(){

if(!input.value){

showStatus(
"Please enter some text to encode.",
"error"
);

return;

}

try{

const bytes =
new TextEncoder()
.encode(input.value);

let binary = "";

bytes.forEach(byte => {
binary += String.fromCharCode(byte);
});

output.value =
btoa(binary);

showStatus(
"✓ Text encoded to Base64 successfully.",
"success"
);

updateCounters();

}

catch(error){

output.value = "";

showStatus(
"❌ Unable to encode the text.",
"error"
);

updateCounters();

}

}


/* Decode */

function decodeText(){

if(!input.value.trim()){

showStatus(
"Please enter Base64 text to decode.",
"error"
);

return;

}

try{

const binary =
atob(input.value.trim());

const bytes =
Uint8Array.from(
binary,
char => char.charCodeAt(0)
);

output.value =
new TextDecoder()
.decode(bytes);

showStatus(
"✓ Base64 decoded successfully.",
"success"
);

updateCounters();

}

catch(error){

output.value = "";

showStatus(
"❌ Invalid Base64 input.",
"error"
);

updateCounters();

}

}


/* Copy */

async function copyResult(){

if(!output.value){

showStatus(
"Nothing to copy.",
"error"
);

return;

}

try{

await navigator.clipboard.writeText(
output.value
);

showStatus(
"✓ Result copied to clipboard.",
"success"
);

}

catch(error){

output.select();

document.execCommand("copy");

showStatus(
"✓ Result copied to clipboard.",
"success"
);

}

}


/* Swap */

function swapText(){

const oldInput =
input.value;

input.value =
output.value;

output.value =
oldInput;

showStatus(
"✓ Input and result swapped.",
"success"
);

updateCounters();

}


/* Clear */

function clearAll(){

input.value = "";

output.value = "";

status.textContent = "";

status.className =
"status";

updateCounters();

}


/* Status */

function showStatus(message,type){

status.textContent =
message;

status.className =
"status " + type;

}


/* Initial Counter */

updateCounters();

</script>
