<body>

<div class="container">


<div class="header">

<a class="logo" href="../index.html">
VexTools
</a>

<h1>
Base64 to Image
</h1>

<p>
Convert a Base64 image string back into an image.
</p>

</div>


<div class="card">

<textarea
id="input"
placeholder="Paste Base64 image data here..."
aria-label="Base64 image data"
></textarea>


<button onclick="convert()">
Convert to Image
</button>


<div
id="status"
class="status"
aria-live="polite">
</div>


<div id="result"></div>

</div>


<a class="back" href="../index.html">
← Back to VexTools
</a>


</div>


<script>

function convert(){

const data =
document.getElementById("input")
.value
.trim();

const result =
document.getElementById("result");

const status =
document.getElementById("status");


result.innerHTML = "";

status.textContent = "";


if(!data){

status.textContent =
"Please enter Base64 image data.";

return;

}


/*
   Support both:

   data:image/png;base64,...

   and raw Base64 strings.
*/

let imageData = data;


if(
!data.startsWith("data:image/")
){

imageData =
"data:image/png;base64," + data;

}


const img =
document.createElement("img");

img.className = "preview";

img.alt = "Converted Base64 image";

img.src = imageData;


img.onload = () => {

const link =
document.createElement("a");

link.className = "download";

link.href = imageData;

link.download = "base64-image.png";

link.textContent =
"Download Image";


result.appendChild(img);

result.appendChild(link);


status.textContent =
"✓ Base64 successfully converted to an image.";

};


img.onerror = () => {

status.textContent =
"❌ Invalid Base64 image data.";

};

}

</script>
