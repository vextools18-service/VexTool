<body>

<div class="container">


<div class="header">

<a
class="logo"
href="../index.html">
VexTools
</a>

<h1>
🖼️ Base64 to Image
</h1>

<p>
Convert Base64 image data into a viewable and downloadable image.
</p>

</div>


<div class="card">


<label for="input">
Base64 Image Data
</label>


<textarea
id="input"
placeholder="Paste Base64 image data here...

Example:
data:image/png;base64,iVBORw0KGgo...
or paste a raw Base64 string."
aria-label="Base64 image data"
></textarea>


<div
class="counter"
id="inputCount">
0 characters
</div>


<div class="buttons">

<button onclick="convertImage()">
🖼️ Convert to Image
</button>

<button
class="secondary"
onclick="copyBase64()">
📋 Copy Base64
</button>

<button
class="secondary"
onclick="clearAll()">
🗑️ Clear
</button>

</div>


<div
id="status"
class="status"
aria-live="polite">
</div>


<div
id="result"
class="result hidden">

<div class="preview-box">

<img
id="preview"
class="preview"
alt="Converted Base64 image"
>

<div
id="imageInfo"
class="image-info">
</div>

</div>


<a
id="download"
class="download"
href="#"
download="base64-image.png">
⬇️ Download Image
</a>

</div>


</div>


<a
class="back"
href="../index.html">
← Back to VexTools
</a>


</div>


<script>

const input =
document.getElementById("input");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const preview =
document.getElementById("preview");

const download =
document.getElementById("download");

const imageInfo =
document.getElementById("imageInfo");

const inputCount =
document.getElementById("inputCount");


/* Character Counter */

input.addEventListener(
"input",
updateCounter
);


function updateCounter(){

const length =
input.value.length;

inputCount.textContent =
length +
(length === 1
? " character"
: " characters");

}


/* Convert */

function convertImage(){

const data =
input.value.trim();


result.classList.add("hidden");

status.className =
"status";

status.textContent = "";

imageInfo.innerHTML = "";


if(!data){

showStatus(
"Please enter Base64 image data.",
"error"
);

return;

}


let imageData =
data;

let mimeType =
"image/png";


/*
   Detect Data URI
*/

if(data.startsWith("data:image/")){

const match =
data.match(
/^data:(image\/[a-zA-Z0-9.+-]+);base64,/i
);

if(!match){

showStatus(
"❌ Invalid image data format.",
"error"
);

return;

}

mimeType =
match[1];

imageData =
data;

}


/*
   Raw Base64
*/

else{

const cleanBase64 =
data.replace(/\s/g,"");


if(!isValidBase64(cleanBase64)){

showStatus(
"❌ Invalid Base64 data.",
"error"
);

return;

}

imageData =
"data:" +
mimeType +
";base64," +
cleanBase64;

}


preview.onload = function(){

result.classList.remove("hidden");

const extension =
getExtension(mimeType);

download.href =
imageData;

download.download =
"base64-image." + extension;


imageInfo.innerHTML =
"<span>📐 " +
preview.naturalWidth +
" × " +
preview.naturalHeight +
"</span>" +

"<span>🗂️ " +
mimeType +
"</span>";


showStatus(
"✓ Base64 successfully converted to an image.",
"success"
);

};


preview.onerror = function(){

result.classList.add("hidden");

showStatus(
"❌ The Base64 data does not contain a valid image.",
"error"
);

};


preview.src =
imageData;

}


/* Base64 Validation */

function isValidBase64(value){

if(!value){

return false;

}

if(value.length % 4 !== 0){

return false;

}

return /^[A-Za-z0-9+/]*={0,2}$/.test(value);

}


/* File Extension */

function getExtension(type){

const extensions = {

"image/png":"png",

"image/jpeg":"jpg",

"image/jpg":"jpg",

"image/gif":"gif",

"image/webp":"webp",

"image/svg+xml":"svg",

"image/bmp":"bmp",

"image/x-icon":"ico",

"image/avif":"avif"

};

return extensions[type] || "png";

}


/* Copy Base64 */

async function copyBase64(){

if(!input.value){

showStatus(
"Nothing to copy.",
"error"
);

return;

}

try{

await navigator.clipboard.writeText(
input.value
);

showStatus(
"✓ Base64 copied to clipboard.",
"success"
);

}

catch(error){

input.select();

document.execCommand("copy");

showStatus(
"✓ Base64 copied to clipboard.",
"success"
);

}

}


/* Clear */

function clearAll(){

input.value = "";

preview.src = "";

download.href = "#";

result.classList.add("hidden");

imageInfo.innerHTML = "";

status.textContent = "";

status.className =
"status";

updateCounter();

}


/* Status */

function showStatus(message,type){

status.textContent =
message;

status.className =
"status " + type;

}


updateCounter();

</script>
