<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base64 to Image — VexTools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#070b18;
color:white;
padding:30px 15px;
}

.container{max-width:850px;margin:auto}

.header{text-align:center;margin-bottom:25px}

.logo{
color:#a78bfa;
font-size:28px;
font-weight:900;
text-decoration:none;
}

h1{margin:15px 0 8px}

p{color:#94a3b8}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

textarea{
width:100%;
height:250px;
padding:15px;
background:#0d1427;
color:#22d3ee;
border:1px solid #29344f;
border-radius:12px;
resize:vertical;
font-size:13px;
}

button{
width:100%;
margin-top:15px;
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;
font-weight:bold;
cursor:pointer;
}

.preview{
max-width:100%;
display:block;
margin:20px auto;
border-radius:12px;
}

.download{
display:block;
text-align:center;
padding:13px;
background:#06b6d4;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>
<h1>Base64 to Image</h1>
<p>Convert a Base64 image string back into an image.</p>
</div>

<div class="card">

<textarea id="input" placeholder="Paste Base64 image data here..."></textarea>

<button onclick="convert()">Convert to Image</button>

<div id="result"></div>

</div>
</div>

<script>
function convert(){

const data=document.getElementById("input").value.trim();

if(!data){
alert("Please enter Base64 image data.");
return;
}

const img=document.createElement("img");

img.className="preview";
img.src=data;

img.onload=()=>{

const link=document.createElement("a");

link.className="download";
link.href=data;
link.download="base64-image.png";
link.textContent="Download Image";

document.getElementById("result").innerHTML="";
document.getElementById("result").appendChild(img);
document.getElementById("result").appendChild(link);

};

img.onerror=()=>{
alert("Invalid Base64 image data.");
};

}
</script>

</body>
</html>
