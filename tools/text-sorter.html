<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#070b18;
color:white;
padding:30px 15px;
min-height:100vh;
}

.container{
max-width:850px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:25px;
}

.logo{
display:inline-block;
color:#a78bfa;
font-size:28px;
font-weight:900;
text-decoration:none;
margin-bottom:5px;
}

h1{
margin:15px 0 8px;
font-size:36px;
}

.header p{
color:#94a3b8;
line-height:1.6;
}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

textarea{
width:100%;
height:300px;
padding:18px;
background:#0d1427;
color:white;
border:1px solid #29344f;
border-radius:14px;
resize:vertical;
outline:none;
font-size:16px;
line-height:1.6;
}

textarea:focus{
border-color:#7c3aed;
}

.buttons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:15px;
}

button{
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.info{
margin-top:18px;
text-align:center;
color:#94a3b8;
font-size:13px;
line-height:1.6;
}

@media(max-width:500px){

.buttons{
grid-template-columns:1fr;
}

h1{
font-size:29px;
}

}

</style>

</head>


<body>

<main class="container">

<header class="header">

<a
    class="logo"
    href="../index.html"
    aria-label="VexTools Home"
>
    VexTools
</a>

<h1>Text Sorter</h1>

<p>
Sort your lines alphabetically or reverse alphabetically.
</p>

</header>


<section
    class="card"
    aria-label="Text Sorter Tool"
>

<textarea
    id="text"
    placeholder="Enter one item per line..."
    aria-label="Text to sort"
></textarea>


<div class="buttons">

<button
    type="button"
    onclick="sortAZ()"
>
    A → Z
</button>

<button
    type="button"
    onclick="sortZA()"
>
    Z → A
</button>

<button
    type="button"
    onclick="removeEmpty()"
>
    Remove Empty Lines
</button>

<button
    type="button"
    onclick="copyText()"
>
    Copy
</button>

</div>


<p class="info">
Sort your text directly in your browser.
No text is uploaded to a server.
</p>

</section>

</main>


<script>

function getLines(){

    return document
        .getElementById("text")
        .value
        .split(/\r?\n/);

}


/* =========================
   A → Z
========================= */

function sortAZ(){

    let lines =
        getLines()
        .filter(x => x.trim());

    lines.sort(
        (a,b) => a.localeCompare(b)
    );

    document.getElementById("text").value =
        lines.join("\n");

}


/* =========================
   Z → A
========================= */

function sortZA(){

    let lines =
        getLines()
        .filter(x => x.trim());

    lines.sort(
        (a,b) => b.localeCompare(a)
    );

    document.getElementById("text").value =
        lines.join("\n");

}


/* =========================
   REMOVE EMPTY LINES
========================= */

function removeEmpty(){

    document.getElementById("text").value =
        getLines()
        .filter(x => x.trim())
        .join("\n");

}


/* =========================
   COPY
========================= */

function copyText(){

    const text =
        document.getElementById("text").value;

    if(!text){
        return;
    }

    navigator.clipboard.writeText(text);

}

</script>

</body>

</html>
