<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Sorter — VexTools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#070b18;
color:white;
padding:30px 15px;
}

.container{max-width:850px;margin:auto}

.header{text-align:center;margin-bottom:25px}

.logo{
color:#a78bfa;
font-size:28px;
font-weight:900;
text-decoration:none;
}

h1{margin:15px 0 8px}

p{color:#94a3b8}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

textarea{
width:100%;
height:300px;
padding:18px;
background:#0d1427;
color:white;
border:1px solid #29344f;
border-radius:14px;
resize:vertical;
outline:none;
}

.buttons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:15px;
}

button{
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;
font-weight:bold;
cursor:pointer;
}

@media(max-width:500px){
.buttons{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>
<h1>Text Sorter</h1>
<p>Sort your lines alphabetically or reverse alphabetically.</p>
</div>

<div class="card">

<textarea id="text" placeholder="Enter one item per line..."></textarea>

<div class="buttons">
<button onclick="sortAZ()">A → Z</button>
<button onclick="sortZA()">Z → A</button>
<button onclick="removeEmpty()">Remove Empty Lines</button>
<button onclick="copyText()">Copy</button>
</div>

</div>
</div>

<script>
function getLines(){
return document.getElementById("text").value.split(/\r?\n/);
}

function sortAZ(){
let lines=getLines().filter(x=>x.trim());
lines.sort((a,b)=>a.localeCompare(b));
document.getElementById("text").value=lines.join("\n");
}

function sortZA(){
let lines=getLines().filter(x=>x.trim());
lines.sort((a,b)=>b.localeCompare(a));
document.getElementById("text").value=lines.join("\n");
}

function removeEmpty(){
document.getElementById("text").value=
getLines().filter(x=>x.trim()).join("\n");
}

function copyText(){
navigator.clipboard.writeText(document.getElementById("text").value);
}
</script>

</body>
</html>
