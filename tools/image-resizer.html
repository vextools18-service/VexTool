<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Resizer — VexTools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#070b18;
color:white;
padding:30px 15px;
}

.container{max-width:850px;margin:auto}

.header{text-align:center;margin-bottom:25px}

.logo{
color:#a78bfa;
font-size:28px;
font-weight:900;
text-decoration:none;
}

h1{margin:15px 0 8px}

p{color:#94a3b8}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

input{
width:100%;
padding:13px;
margin-bottom:10px;
background:#0d1427;
color:white;
border:1px solid #29344f;
border-radius:10px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

button{
width:100%;
margin-top:15px;
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;
font-weight:bold;
cursor:pointer;
}

.download{
display:block;
margin-top:15px;
text-align:center;
padding:13px;
border-radius:10px;
background:#06b6d4;
color:white;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>
<h1>Image Resizer</h1>
<p>Resize images to custom dimensions.</p>
</div>

<div class="card">

<input id="file" type="file" accept="image/*">

<div class="row">
<input id="width" type="number" placeholder="Width">
<input id="height" type="number" placeholder="Height">
</div>

<button onclick="resizeImage()">Resize Image</button>

</div>
</div>

<script>
function resizeImage(){

const file=document.getElementById("file").files[0];

if(!file){
alert("Please select an image.");
return;
}

const width=Number(document.getElementById("width").value);
const height=Number(document.getElementById("height").value);

if(!width || !height){
alert("Enter width and height.");
return;
}

const img=new Image();

img.onload=()=>{

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

canvas.getContext("2d").drawImage(
img,
0,
0,
width,
height
);

canvas.toBlob(blob=>{

const url=URL.createObjectURL(blob);

const link=document.createElement("a");
link.className="download";
link.href=url;
link.download="resized-image.png";
link.textContent="Download Resized Image";

document.querySelector(".card").appendChild(link);

},"image/png");

};

img.src=URL.createObjectURL(file);
}
</script>

</body>
</html>
