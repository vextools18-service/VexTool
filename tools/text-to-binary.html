<main class="container">

<header class="header">

<a
    class="logo"
    href="../index.html"

>
    VexTools
</a>

<h1>🔢 Text to Binary</h1>

<p>
Convert text into binary code instantly.
</p>

</header>

<section
    class="card"
    aria-label="Text to Binary Converter"
>

<textarea
    id="input"
    placeholder="Enter text..."
    aria-label="Text input"
></textarea>

<div class="buttons">

<button
    type="button"
    onclick="convert()"
>
    Convert to Binary
</button>

<button
    type="button"
    class="secondary"
    onclick="copyBinary()"
>
    Copy Binary
</button>

</div>

<textarea
    id="output"
    readonly
    placeholder="Binary result..."
    aria-label="Binary output"
></textarea>

<p class="info">
Convert text to binary directly in your browser.
Your text is processed locally and is not uploaded to a server.
</p>

</section>

</main>

<script>

const input = document.getElementById("input");
const output = document.getElementById("output");


function convert(){

    if(!input.value){

        output.value = "";

        return;

    }

    const bytes =
        new TextEncoder().encode(input.value);

    output.value =
        [...bytes]
        .map(byte =>
            byte
            .toString(2)
            .padStart(8,"0")
        )
        .join(" ");

}


async function copyBinary(){

    if(!output.value){
        return;
    }

    try{

        await navigator.clipboard.writeText(
            output.value
        );

    }catch{

        output.select();

        document.execCommand("copy");

        output.setSelectionRange(0,0);

    }

}

</script>
