<body>

<div class="box">

<h1>HTML Formatter</h1>

<p class="description">
Format and beautify HTML code online for free.
Make your HTML easier to read and organize.
</p>

<textarea
id="code"
placeholder="Paste HTML here..."
></textarea>

<br>

<button onclick="format()">Format HTML</button>

</div>

<script>
function format(){

let s=document.getElementById("code").value;

if(!s.trim()){
return;
}

let out="",level=0;

s=s
.replace(/>\s*</g,"><")
.replace(/</g,"\n<")
.trim();

s.split("\n").forEach(x=>{

if(/^<\/\w/.test(x)){
level--;
}

out+="  ".repeat(Math.max(level,0))+x+"\n";

if(
/^<\w[^>]*[^\/]>$/.test(x) &&
!/<\/\w+>/.test(x) &&
!/^<!(--)?/.test(x)
){
level++;
}

});

document.getElementById("code").value=out.trim();
}
</script>
