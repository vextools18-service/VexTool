<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Formatter - VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:30px;text-align:center}
.box{max-width:900px;margin:auto;background:#111a30;padding:25px;border-radius:20px}
textarea{width:95%;height:400px;padding:15px;font-family:monospace}
button{padding:12px 25px;margin:15px;background:#7c3aed;color:white;border:0;border-radius:10px}
</style>
</head>
<body>
<div class="box">
<h1>HTML Formatter</h1>
<textarea id="code" placeholder="Paste HTML here..."></textarea>
<br>
<button onclick="format()">Format HTML</button>
</div>
<script>
function format(){
let s=document.getElementById("code").value;
let out="",level=0;
s=s.replace(/>\s*</g,"><").replace(/</g,"\n<").trim();
s.split("\n").forEach(x=>{
if(/^<\/\w/.test(x))level--;
out+="  ".repeat(Math.max(level,0))+x+"\n";
if(/^<\w[^>]*[^\/]>$/.test(x)&&!/<\/\w+>/.test(x)&&!/^<!(--)?/.test(x))level++;
});
document.getElementById("code").value=out.trim();
}
</script>
</body>
</html>
