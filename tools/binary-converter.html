<body>

<div class="container">

<h1>💾 Binary Converter</h1>

<p>
Convert text to binary and binary back to text quickly and easily.
</p>


<textarea
id="input"
placeholder="Enter text or binary..."
aria-label="Binary converter input"
></textarea>


<button onclick="toBinary()">
Text → Binary
</button>

<button onclick="toText()">
Binary → Text
</button>


<textarea
id="output"
placeholder="Result..."
readonly
aria-label="Binary converter result"
></textarea>


<div id="status" aria-live="polite"></div>


<a class="back" href="../index.html">
← Back to VexTools
</a>

</div>


<script>

const input =
document.getElementById("input");

const output =
document.getElementById("output");

const status =
document.getElementById("status");


function toBinary(){

if(!input.value){

output.value = "";

status.textContent =
"Please enter some text.";

return;

}


try{

output.value =
[...input.value]
.map(
c => c.charCodeAt(0)
.toString(2)
.padStart(8,"0")
)
.join(" ");


status.textContent =
"✓ Text converted to binary successfully.";

}

catch(error){

output.value = "";

status.textContent =
"❌ Unable to convert text.";

}

}


function toText(){

const value =
input.value.trim();


if(!value){

output.value = "";

status.textContent =
"Please enter binary data.";

return;

}


const parts =
value.split(/\s+/);


const valid =
parts.every(
b => /^[01]+$/.test(b)
);


if(!valid){

output.value = "";

status.textContent =
"❌ Invalid binary. Use only 0 and 1.";

return;

}


try{

output.value =
parts
.map(
b => String.fromCharCode(
parseInt(b,2)
)
)
.join("");


status.textContent =
"✓ Binary converted to text successfully.";

}

catch(error){

output.value = "";

status.textContent =
"❌ Invalid binary data.";

}

}

</script>
