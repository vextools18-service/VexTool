<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binary Converter — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:40px 20px}
.container{max-width:800px;margin:auto}
textarea{width:100%;height:180px;margin:15px 0;padding:20px;background:#111a30;color:white;border:1px solid #27304a;border-radius:12px}
button{padding:13px 22px;background:#7c3aed;color:white;border:0;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>💾 Binary Converter</h1>
<p>Convert text to binary and binary back to text.</p>
<textarea id="input" placeholder="Enter text or binary..."></textarea>
<button onclick="toBinary()">Text → Binary</button>
<button onclick="toText()">Binary → Text</button>
<textarea id="output" placeholder="Result..." readonly></textarea>
</div>
<script>
function toBinary(){
output.value=[...input.value].map(c=>c.charCodeAt(0).toString(2).padStart(8,"0")).join(" ");
}
function toText(){
try{
output.value=input.value.trim().split(/\s+/).map(b=>String.fromCharCode(parseInt(b,2))).join("");
}catch(e){output.value="Invalid binary";}
}
</script>
</body>
</html>
