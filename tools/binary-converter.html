<body>

<div class="container">

<h1>💾 Binary Converter</h1>

<p>
Convert text to binary and binary back to text quickly and easily.
</p>


<textarea
id="input"
placeholder="Enter text or binary..."
aria-label="Binary converter input"
spellcheck="false"
></textarea>


<div class="buttons">

<button type="button" onclick="toBinary()">
Text → Binary
</button>

<button type="button" onclick="toText()">
Binary → Text
</button>

</div>


<textarea
id="output"
placeholder="Result..."
readonly
aria-label="Binary converter result"
spellcheck="false"
></textarea>


<div
id="status"
aria-live="polite">
</div>


<a class="back" href="../index.html">
← Back to VexTools
</a>

</div>


<script>

const input = document.getElementById("input");
const output = document.getElementById("output");
const status = document.getElementById("status");


/* ==============================
   TEXT → BINARY
============================== */

function toBinary(){

const text = input.value;

if(!text){

output.value = "";

status.textContent =
"Please enter some text.";

return;

}

try{

const bytes =
new TextEncoder().encode(text);

output.value =
Array.from(bytes)
.map(byte =>
byte.toString(2).padStart(8,"0")
)
.join(" ");

status.textContent =
"✓ Text converted to binary successfully.";

}

catch(error){

output.value = "";

status.textContent =
"❌ Unable to convert text.";

}

}


/* ==============================
   BINARY → TEXT
============================== */

function toText(){

const value =
input.value.trim();

if(!value){

output.value = "";

status.textContent =
"Please enter binary data.";

return;

}


/*
   Allow spaces and line breaks
   between binary bytes.
*/

const parts =
value.split(/\s+/);


/*
   Every binary group must
   contain exactly 8 bits.
*/

const valid =
parts.every(
b => /^[01]{8}$/.test(b)
);


if(!valid){

output.value = "";

status.textContent =
"❌ Invalid binary. Use 8-bit groups like 01001000.";

return;

}

try{

const bytes =
new Uint8Array(
parts.map(
b => parseInt(b,2)
)
);

output.value =
new TextDecoder("utf-8", {
fatal:true
}).decode(bytes);

status.textContent =
"✓ Binary converted to text successfully.";

}

catch(error){

output.value = "";

status.textContent =
"❌ Invalid UTF-8 binary data.";

}

}


/* ==============================
   CLEAR OUTPUT WHEN INPUT CHANGES
============================== */

input.addEventListener("input", () => {

status.textContent = "";

});

</script>
