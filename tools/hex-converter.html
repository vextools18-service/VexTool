<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex Converter — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:40px 20px}
.container{max-width:800px;margin:auto}
textarea{width:100%;height:180px;margin:15px 0;padding:20px;background:#111a30;color:white;border:1px solid #27304a;border-radius:12px}
button{padding:13px 22px;background:#7c3aed;color:white;border:0;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>🔢 Hex Converter</h1>
<p>Convert text to hexadecimal and back.</p>
<textarea id="input" placeholder="Enter text or hex..."></textarea>
<button onclick="toHex()">Text → HEX</button>
<button onclick="toText()">HEX → Text</button>
<textarea id="output" placeholder="Result..." readonly></textarea>
</div>
<script>
function toHex(){
output.value=[...input.value].map(c=>c.charCodeAt(0).toString(16).padStart(2,"0")).join(" ");
}
function toText(){
try{
output.value=input.value.trim().split(/\s+/).map(h=>String.fromCharCode(parseInt(h,16))).join("");
}catch(e){output.value="Invalid HEX";}
}
</script>
</body>
</html>
