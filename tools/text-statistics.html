<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#070b18;
    color:white;
    padding:30px 15px;
    min-height:100vh;
}

.container{
    max-width:850px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    display:inline-block;
    color:#a78bfa;
    font-size:28px;
    font-weight:900;
    text-decoration:none;
    margin-bottom:5px;
}

h1{
    margin:15px 0 8px;
    font-size:36px;
}

.header p{
    color:#94a3b8;
    line-height:1.6;
}

.card{
    background:rgba(17,25,45,.85);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:22px;
}

textarea{
    width:100%;
    height:300px;
    padding:18px;
    background:#0d1427;
    color:white;
    border:1px solid #29344f;
    border-radius:14px;
    resize:vertical;
    outline:none;
    font-size:16px;
    line-height:1.6;
}

textarea:focus{
    border-color:#7c3aed;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.stat{
    padding:20px 10px;
    background:#111a30;
    border:1px solid #27304a;
    border-radius:12px;
    text-align:center;
}

.stat span{
    display:block;
    color:#94a3b8;
    font-size:14px;
    margin-bottom:8px;
}

.stat b{
    font-size:28px;
    color:#22d3ee;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

button{
    padding:13px;
    border:0;
    border-radius:10px;
    background:linear-gradient(90deg,#7c3aed,#6366f1);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.status{
    min-height:20px;
    margin-top:12px;
    text-align:center;
    color:#22d3ee;
    font-size:13px;
}

.info{
    margin-top:18px;
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .buttons{
        grid-template-columns:1fr;
    }

    h1{
        font-size:29px;
    }

}

</style>

</head>

<body>

<main class="container">

<header class="header">

<a
    class="logo"
    href="../index.html"
    aria-label="VexTools Home"
>
    VexTools
</a>

<h1>Text Statistics</h1>

<p>
Count words, characters, and lines in your text instantly.
</p>

</header>

<section
    class="card"
    aria-label="Text Statistics Tool"
>

<textarea
    id="text"
    placeholder="Type or paste text..."
    aria-label="Text to analyze"
></textarea>

<div class="stats">

    <div class="stat">
        <span>Words</span>
        <b id="words">0</b>
    </div>

    <div class="stat">
        <span>Characters</span>
        <b id="chars">0</b>
    </div>

    <div class="stat">
        <span>Lines</span>
        <b id="lines">0</b>
    </div>

</div>

<div class="buttons">

<button
    type="button"
    onclick="copyText()"
>
Copy Text
</button>

<button
    type="button"
    onclick="clearText()"
>
Clear
</button>

</div>

<div
    class="status"
    id="status"
    aria-live="polite"
></div>

<p class="info">
Analyze your text directly in your browser.
No text is uploaded to a server.
</p>

</section>

</main>

<script>

const text = document.getElementById("text");
const words = document.getElementById("words");
const chars = document.getElementById("chars");
const lines = document.getElementById("lines");
const status = document.getElementById("status");


/* =========================
   UPDATE STATISTICS
========================= */

function updateStats(){

    const value = text.value;

    chars.textContent = value.length;

    words.textContent =
        value.trim()
        ? value.trim().split(/\s+/).length
        : 0;

    lines.textContent =
        value
        ? value.split(/\r?\n/).length
        : 0;

}


/* =========================
   COPY
========================= */

async function copyText(){

    if(!text.value){

        status.textContent = "Nothing to copy.";

        return;
    }

    try{

        await navigator.clipboard.writeText(
            text.value
        );

        status.textContent = "✓ Text copied.";

    }catch{

        text.select();
        document.execCommand("copy");

        status.textContent = "✓ Text copied.";

    }

    setTimeout(() => {
        status.textContent = "";
    },2000);

}


/* =========================
   CLEAR
========================= */

function clearText(){

    text.value = "";

    updateStats();

    status.textContent = "✓ Text cleared.";

    setTimeout(() => {
        status.textContent = "";
    },2000);

}


/* =========================
   LIVE UPDATE
========================= */

text.addEventListener(
    "input",
    updateStats
);

updateStats();

</script>

</body>

</html>
