<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Compress PDF — VexTools</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfjs-dist/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#070b18;
    color:#f8fafc;
    min-height:100vh;
    padding:30px 15px;
}

.container{
    max-width:850px;
    margin:auto;
}

.header{
    text-align:center;
    margin:25px 0 35px;
}

.header h1{
    font-size:42px;
}

.header h1 span{
    color:#a78bfa;
}

.header p{
    color:#94a3b8;
    margin-top:10px;
}

.card{
    background:#11192d;
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:25px;
}

.drop{
    display:block;
    border:2px dashed #7c3aed;
    border-radius:16px;
    padding:45px 20px;
    text-align:center;
    cursor:pointer;
    background:rgba(124,58,237,.08);
    transition:.25s;
}

.drop:hover{
    background:rgba(124,58,237,.15);
}

.drop h3{
    margin-bottom:8px;
}

.drop p{
    color:#94a3b8;
}

#file{
    display:none;
}

.info{
    margin-top:20px;
    padding:16px;
    background:#18223a;
    border-radius:12px;
    color:#cbd5e1;
    line-height:1.7;
}

.settings{
    margin-top:20px;
}

.settings label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0d1425;
    color:white;
    outline:none;
}

.compress{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.compress:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.progress{
    display:none;
    margin-top:20px;
}

.progress-bar{
    height:10px;
    background:#263149;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
    transition:.2s;
}

.progress-text{
    text-align:center;
    margin-top:8px;
    color:#94a3b8;
    font-size:13px;
}

.result{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#10251e;
    border:1px solid #14532d;
    line-height:1.8;
}

.download{
    display:block;
    text-align:center;
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#16a34a;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.status{
    text-align:center;
    margin-top:15px;
    color:#94a3b8;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:#a78bfa;
    text-decoration:none;
}

@media(max-width:500px){

    .header h1{
        font-size:34px;
    }

    .card{
        padding:18px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>Compress <span>PDF</span></h1>

<p>
Reduce PDF file size directly in your browser.
</p>

</div>


<div class="card">


<label class="drop" for="file">

<h3>📄 Select PDF</h3>

<p>
Click here to choose your PDF file
</p>

</label>


<input
    id="file"
    type="file"
    accept=".pdf,application/pdf"
>


<div
    id="info"
    class="info"
>
No PDF selected.
</div>


<div class="settings">

<label>
Compression Level
</label>

<select id="quality">

<option value="0.8">
Low Compression — Better Quality
</option>

<option value="0.6" selected>
Medium Compression — Recommended
</option>

<option value="0.4">
High Compression — Smaller File
</option>

</select>

</div>


<button
    id="compress"
    class="compress"
    disabled
>
Compress PDF
</button>


<div
    id="progress"
    class="progress"
>

<div class="progress-bar">

<div
    id="progressFill"
    class="progress-fill"
></div>

</div>

<div
    id="progressText"
    class="progress-text"
>
Preparing...
</div>

</div>


<div
    id="result"
    class="result"
>

<div id="resultText"></div>

<a
    id="download"
    class="download"
>
⬇️ Download Compressed PDF
</a>

</div>


<div
    id="status"
    class="status"
></div>


</div>


<a
    class="back"
    href="../index.html"
>
← Back to VexTools
</a>


</div>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdfjs-dist/3.11.174/pdf.worker.min.js";


const fileInput =
document.getElementById("file");

const info =
document.getElementById("info");

const compressBtn =
document.getElementById("compress");

const qualitySelect =
document.getElementById("quality");

const progress =
document.getElementById("progress");

const progressFill =
document.getElementById("progressFill");

const progressText =
document.getElementById("progressText");

const result =
document.getElementById("result");

const resultText =
document.getElementById("resultText");

const download =
document.getElementById("download");

const status =
document.getElementById("status");


let selectedFile = null;


fileInput.addEventListener(
"change",
() => {

    selectedFile =
        fileInput.files[0];

    result.style.display =
        "none";

    status.textContent = "";


    if(!selectedFile){

        compressBtn.disabled =
            true;

        info.textContent =
            "No PDF selected.";

        return;

    }


    info.innerHTML =

        "📄 <b>" +
        escapeHTML(selectedFile.name) +
        "</b><br>" +

        "Original Size: " +
        formatSize(selectedFile.size);


    compressBtn.disabled =
        false;

});


function escapeHTML(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");

}


function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }


    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }


    return (
        bytes / (1024 * 1024)
    ).toFixed(2) + " MB";

}


function updateProgress(percent,text){

    progressFill.style.width =
        percent + "%";

    progressText.textContent =
        text;

}


compressBtn.addEventListener(
"click",
async () => {

    if(!selectedFile)
        return;


    compressBtn.disabled =
        true;

    progress.style.display =
        "block";

    result.style.display =
        "none";

    status.textContent =
        "";


    try{

        updateProgress(
            5,
            "Reading PDF..."
        );


        const buffer =
            await selectedFile.arrayBuffer();


        const pdf =
            await pdfjsLib
            .getDocument({
                data:buffer
            })
            .promise;


        const pageCount =
            pdf.numPages;


        updateProgress(
            10,
            `Found ${pageCount} page(s)...`
        );


        const {
            jsPDF
        } = window.jspdf;


        let outputPDF = null;


        const quality =
            Number(
                qualitySelect.value
            );


        for(
            let pageNumber = 1;
            pageNumber <= pageCount;
            pageNumber++
        ){

            const page =
                await pdf.getPage(
                    pageNumber
                );


            const viewport =
                page.getViewport({
                    scale:1.5
                });


            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d",
                    {
                        alpha:false
                    }
                );


            canvas.width =
                Math.floor(
                    viewport.width
                );


            canvas.height =
                Math.floor(
                    viewport.height
                );


            await page.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;


            const imageData =
                canvas.toDataURL(
                    "image/jpeg",
                    quality
                );


            const pageWidth =
                viewport.width /
                1.5;


            const pageHeight =
                viewport.height /
                1.5;


            if(!outputPDF){

                outputPDF =
                    new jsPDF({

                        orientation:
                            pageWidth >
                            pageHeight
                            ? "landscape"
                            : "portrait",

                        unit:"pt",

                        format:[
                            pageWidth,
                            pageHeight
                        ],

                        compress:true

                    });

            }else{

                outputPDF.addPage(
                    [
                        pageWidth,
                        pageHeight
                    ],
                    pageWidth >
                    pageHeight
                    ? "landscape"
                    : "portrait"
                );

            }


            outputPDF.addImage(
                imageData,
                "JPEG",
                0,
                0,
                pageWidth,
                pageHeight,
                undefined,
                "FAST"
            );


            canvas.width = 1;
            canvas.height = 1;


            const percent =
                10 +
                (
                    pageNumber /
                    pageCount
                ) * 80;


            updateProgress(
                percent,
                `Compressing page ${pageNumber} of ${pageCount}...`
            );

        }


        updateProgress(
            95,
            "Creating compressed PDF..."
        );


        const output =
            outputPDF.output(
                "blob"
            );


        const originalSize =
            selectedFile.size;


        const newSize =
            output.size;


        const saved =
            originalSize -
            newSize;


        const percentage =
            originalSize > 0
            ? Math.max(
                0,
                (saved /
                originalSize) *
                100
            )
            : 0;


        const url =
            URL.createObjectURL(
                output
            );


        download.href =
            url;

        download.download =
            "compressed.pdf";


        updateProgress(
            100,
            "Done!"
        );


        result.style.display =
            "block";


        if(newSize < originalSize){

            resultText.innerHTML =

                "✅ <b>Compression complete!</b><br><br>" +

                "Original: " +
                formatSize(
                    originalSize
                ) +

                "<br>" +

                "Compressed: " +
                formatSize(
                    newSize
                ) +

                "<br>" +

                "Saved: " +
                formatSize(
                    saved
                ) +

                " (" +
                percentage.toFixed(1) +
                "%)";

        }else{

            resultText.innerHTML =

                "⚠️ The new PDF is not smaller.<br><br>" +

                "Original: " +
                formatSize(
                    originalSize
                ) +

                "<br>" +

                "New: " +
                formatSize(
                    newSize
                ) +

                "<br><br>" +

                "Try <b>High Compression</b>.";

        }


        status.textContent =
            "Your PDF is ready.";


    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Could not compress this PDF.";

        progress.style.display =
            "none";

    }


    compressBtn.disabled =
        false;

});


</script>

</body>
</html>
