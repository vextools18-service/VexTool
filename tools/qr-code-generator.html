<meta name="twitter:card" content="summary">

<style>
body{
font-family:Arial;
background:#070b18;
color:white;
text-align:center;
padding:50px;
}

.box{
max-width:600px;
margin:auto;
background:#111a30;
padding:30px;
border-radius:20px;
}

input,button{
padding:14px;
margin:8px;
border-radius:10px;
border:0;
}

input{
width:80%;
background:#0d1427;
color:white;
border:1px solid #27304a;
}

button{
background:#7c3aed;
color:white;
cursor:pointer;
font-weight:bold;
}

#qr{
margin:25px;
}

#qr img{
background:white;
padding:10px;
border-radius:10px;
max-width:220px;
}

.download{
display:block;
width:80%;
margin:15px auto;
padding:13px;
background:#06b6d4;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>📱 QR Code Generator</h1>

<p>Generate a QR code from any text or URL.</p>

<input
id="text"
placeholder="Enter text or URL"
>

<button onclick="generate()">
Generate
</button>

<div id="qr"></div>

</div>

<script>

function generate(){

let text=document.getElementById("text").value.trim();

if(!text){
alert("Enter something first");
return;
}

const qr=document.getElementById("qr");

qr.innerHTML=`
<img
id="qrImage"
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(text)}"
alt="Generated QR Code"
>
`;

setTimeout(()=>{

const img=document.getElementById("qrImage");

if(img){

const old=document.querySelector(".download");
if(old)old.remove();

const link=document.createElement("a");

link.className="download";
link.href=img.src;
link.target="_blank";
link.download="vextools-qr-code.png";
link.textContent="⬇️ Download QR Code";

qr.appendChild(link);

}

},500);

}

</script>

</body>
</html>
