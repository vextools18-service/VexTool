<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Generator - VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;text-align:center;padding:50px}
.box{max-width:600px;margin:auto;background:#111a30;padding:30px;border-radius:20px}
input,button{padding:14px;margin:8px;border-radius:10px;border:0}
input{width:80%}button{background:#7c3aed;color:white;cursor:pointer}
#qr{margin:25px}
</style>
</head>
<body>
<div class="box">
<h1>QR Code Generator</h1>
<p>Generate a QR code from any text or URL.</p>
<input id="text" placeholder="Enter text or URL">
<button onclick="generate()">Generate</button>
<div id="qr"></div>
</div>
<script>
function generate(){
let text=document.getElementById("text").value.trim();
if(!text)return alert("Enter something first");
document.getElementById("qr").innerHTML=
`<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(text)}">`;
}
</script>
</body>
</html>
