<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text to Hex — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:40px 20px}
.container{max-width:800px;margin:auto}
textarea{width:100%;height:180px;padding:18px;background:#111a30;color:white;border:1px solid #27304a;border-radius:12px;margin:15px 0}
button{padding:14px 25px;background:#7c3aed;color:white;border:0;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>🔣 Text to HEX</h1>
<p>Convert text into hexadecimal.</p>
<textarea id="input" placeholder="Enter text..."></textarea>
<button onclick="convert()">Convert</button>
<textarea id="output" readonly placeholder="HEX result..."></textarea>
</div>

<script>
function convert(){
output.value=[...input.value]
.map(c=>c.charCodeAt(0).toString(16).padStart(2,"0"))
.join(" ");
}
</script>
</body>
</html>
