<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Validator — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:40px 20px}
.container{max-width:800px;margin:auto;text-align:center}
textarea{width:100%;height:320px;margin:25px 0;padding:20px;background:#111a30;color:white;border:1px solid #27304a;border-radius:12px;font-family:monospace}
button{padding:14px 30px;background:#7c3aed;color:white;border:0;border-radius:10px}
#result{margin-top:20px;padding:20px;border-radius:10px;background:#111a30}
</style>
</head>
<body>
<div class="container">
<h1>✅ JSON Validator</h1>
<p>Check whether your JSON is valid.</p>
<textarea id="json" placeholder='{"name":"VexTools"}'></textarea>
<button onclick="validate()">Validate JSON</button>
<div id="result">Waiting for JSON...</div>
</div>
<script>
function validate(){
try{
JSON.parse(json.value);
result.textContent="✅ Valid JSON";
}catch(e){
result.textContent="❌ Invalid JSON: "+e.message;
}
}
</script>
</body>
</html>
