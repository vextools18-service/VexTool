<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Split PDF — VexTools</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#070b18;
color:#f8fafc;
min-height:100vh;
padding:30px 15px;
}
.container{max-width:800px;margin:auto}
.header{text-align:center;margin:25px 0 35px}
.header h1{font-size:42px}
.header span{color:#22d3ee}
.header p{color:#94a3b8;margin-top:10px}
.card{
background:#11192d;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:25px;
}
.drop{
display:block;
border:2px dashed #06b6d4;
border-radius:16px;
padding:45px 20px;
text-align:center;
cursor:pointer;
background:rgba(6,182,212,.07);
}
.drop p{color:#94a3b8;margin-top:8px}
input{display:none}
.info{
margin-top:20px;
padding:15px;
background:#18223a;
border-radius:10px;
color:#cbd5e1;
}
label.title{
display:block;
margin-top:20px;
margin-bottom:8px;
font-weight:bold;
}
input[type=text]{
display:block;
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #334155;
background:#0d1425;
color:white;
outline:none;
}
button{
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#06b6d4);
color:white;
font-weight:bold;
cursor:pointer;
}
button:disabled{opacity:.5}
.status{text-align:center;margin-top:15px;color:#94a3b8}
.back{
display:inline-block;
margin-top:20px;
color:#a78bfa;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>Split <span>PDF</span></h1>
<p>Extract selected pages from a PDF.</p>
</div>

<div class="card">

<label class="drop" for="file">
<h3>📄 Select PDF</h3>
<p>Click here to choose your PDF file</p>
</label>

<input id="file" type="file" accept=".pdf,application/pdf">

<div id="info" class="info">
No PDF selected.
</div>

<label class="title">Pages to extract</label>

<input
id="pages"
type="text"
placeholder="Example: 1,3,5 or 1-4"
>

<button id="split" disabled>
Split & Download
</button>

<div id="status" class="status"></div>

</div>

<a class="back" href="../index.html">← Back to VexTools</a>

</div>

<script>
const fileInput=document.getElementById("file");
const pagesInput=document.getElementById("pages");
const splitBtn=document.getElementById("split");
const info=document.getElementById("info");
const status=document.getElementById("status");

let selectedFile=null;

fileInput.addEventListener("change",async()=>{
selectedFile=fileInput.files[0];

if(!selectedFile)return;

try{
const bytes=await selectedFile.arrayBuffer();
const pdf=await PDFLib.PDFDocument.load(bytes);

info.textContent=
`${selectedFile.name} — ${pdf.getPageCount()} pages`;

splitBtn.disabled=false;

}catch{
info.textContent="❌ Invalid PDF file.";
splitBtn.disabled=true;
}
});

function getPages(text,total){

const result=new Set();

const parts=text.split(",");

for(const part of parts){

const value=part.trim();

if(value.includes("-")){

const [a,b]=value.split("-").map(Number);

if(
Number.isInteger(a)&&
Number.isInteger(b)&&
a>=1&&
b<=total&&
a<=b
){
for(let i=a;i<=b;i++)result.add(i);
}

}else{

const n=Number(value);

if(Number.isInteger(n)&&n>=1&&n<=total){
result.add(n);
}
}
}

return [...result].sort((a,b)=>a-b);
}

splitBtn.onclick=async()=>{

if(!selectedFile)return;

try{

status.textContent="Splitting PDF...";

const bytes=await selectedFile.arrayBuffer();

const source=await PDFLib.PDFDocument.load(bytes);

const total=source.getPageCount();

const pages=getPages(pagesInput.value,total);

if(!pages.length){
status.textContent="❌ Enter valid page numbers.";
return;
}

const output=await PDFLib.PDFDocument.create();

const copied=await output.copyPages(
source,
pages.map(x=>x-1)
);

copied.forEach(page=>output.addPage(page));

const result=await output.save();

const blob=new Blob(
[result],
{type:"application/pdf"}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="split.pdf";
a.click();

URL.revokeObjectURL(url);

status.textContent="✅ PDF created successfully!";

}catch(error){

console.error(error);
status.textContent="❌ Could not split PDF.";

}
};
</script>

</body>
</html>
