<body>

<div class="container">

    <div class="header">

        <a class="logo" href="../index.html">
            VexTools
        </a>

        <h1>Case Converter</h1>

        <p>
            Convert your text into different cases instantly.
        </p>

    </div>


    <div class="card">

        <textarea
            id="text"
            placeholder="Type or paste your text here..."
            aria-label="Text to convert"
            spellcheck="false"
        ></textarea>


        <div class="buttons">

            <button type="button" onclick="upper()">
                UPPERCASE
            </button>

            <button type="button" onclick="lower()">
                lowercase
            </button>

            <button type="button" onclick="titleCase()">
                Title Case
            </button>

            <button type="button" onclick="sentenceCase()">
                Sentence case
            </button>

            <button type="button" onclick="alternate()">
                aLtErNaTe CaSe
            </button>

            <button type="button" onclick="copyText()">
                Copy Text
            </button>

            <button type="button" onclick="clearText()">
                Clear
            </button>

        </div>


        <div
            class="status"
            id="status"
            aria-live="polite">
        </div>


        <div class="stats">

            <span id="words">
                Words: 0
            </span>

            <span id="chars">
                Characters: 0
            </span>

        </div>

    </div>


    <a class="back" href="../index.html">
        ← Back to VexTools
    </a>

</div>


<script>

const text =
    document.getElementById("text");

const status =
    document.getElementById("status");

const words =
    document.getElementById("words");

const chars =
    document.getElementById("chars");


/* UPPERCASE */

function upper(){

    text.value =
        text.value.toUpperCase();

    showStatus("✓ Text converted to uppercase.");

    update();

}


/* LOWERCASE */

function lower(){

    text.value =
        text.value.toLowerCase();

    showStatus("✓ Text converted to lowercase.");

    update();

}


/* TITLE CASE */

function titleCase(){

    const value =
        text.value.toLowerCase();

    text.value =
        value.replace(
            /(^|[\s-])([a-z])/g,
            function(match, separator, letter){

                return separator +
                    letter.toUpperCase();

            }
        );

    showStatus("✓ Text converted to Title Case.");

    update();

}


/* SENTENCE CASE */

function sentenceCase(){

    let value =
        text.value.toLowerCase();

    value =
        value.replace(
            /(^\s*[a-z])|([.!?]\s+[a-z])/g,
            function(match){

                return match.toUpperCase();

            }
        );

    text.value = value;

    showStatus("✓ Text converted to Sentence case.");

    update();

}


/* ALTERNATE CASE */

function alternate(){

    let index = 0;

    text.value =
        [...text.value]
        .map(function(character){

            if(/[a-zA-Z]/.test(character)){

                const result =
                    index % 2 === 0
                    ? character.toUpperCase()
                    : character.toLowerCase();

                index++;

                return result;

            }

            return character;

        })
        .join("");

    showStatus("✓ Alternate case applied.");

    update();

}


/* COPY */

async function copyText(){

    if(!text.value){

        showStatus("⚠️ There is no text to copy.");

        return;

    }

    try{

        await navigator.clipboard.writeText(
            text.value
        );

        showStatus(
            "✓ Text copied to clipboard."
        );

    }
    catch(error){

        /* Fallback for browsers where Clipboard API is unavailable */

        text.select();
        text.setSelectionRange(
            0,
            text.value.length
        );

        try{

            document.execCommand("copy");

            showStatus(
                "✓ Text copied to clipboard."
            );

        }
        catch(error){

            showStatus(
                "❌ Unable to copy text."
            );

        }

        window.getSelection().removeAllRanges();

    }

}


/* CLEAR */

function clearText(){

    text.value = "";

    showStatus("✓ Text cleared.");

    update();

}


/* STATUS */

function showStatus(message){

    status.textContent = message;

}


/* WORD + CHARACTER COUNTER */

function update(){

    const value =
        text.value.trim();

    const wordCount =
        value
        ? value.split(/\s+/).length
        : 0;

    words.textContent =
        "Words: " + wordCount;

    chars.textContent =
        "Characters: " + text.value.length;

}


/* LIVE COUNTER */

text.addEventListener(
    "input",
    update
);


/* INITIAL COUNTER */

update();

</script>
