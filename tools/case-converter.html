<div class="container">


<div class="header">

<a class="logo" href="../index.html">
VexTools
</a>

<h1>Case Converter</h1>

<p>
Convert your text into different cases instantly.
</p>

</div>


<div class="card">


<textarea
id="text"
placeholder="Type or paste your text here..."
aria-label="Text to convert"
></textarea>


<div class="buttons">

<button onclick="upper()">
UPPERCASE
</button>

<button onclick="lower()">
lowercase
</button>

<button onclick="titleCase()">
Title Case
</button>

<button onclick="sentenceCase()">
Sentence case
</button>

<button onclick="alternate()">
aLtErNaTe CaSe
</button>

<button onclick="copyText()">
Copy Text
</button>

<button onclick="clearText()">
Clear
</button>

</div>


<div class="stats">

<span id="words">
Words: 0
</span>

<span id="chars">
Characters: 0
</span>

</div>

</div>


<a class="back" href="../index.html">
← Back to VexTools
</a>


</div>


<script>

const text =
document.getElementById("text");


function upper(){

    text.value =
        text.value.toUpperCase();

    update();

}


function lower(){

    text.value =
        text.value.toLowerCase();

    update();

}


function titleCase(){

    text.value =
        text.value
        .toLowerCase()
        .replace(/\b\w/g,c =>
            c.toUpperCase()
        );

    update();

}


function sentenceCase(){

    text.value =
        text.value
        .toLowerCase()
        .replace(
            /(^\s*\w|[.!?]\s+\w)/g,
            c => c.toUpperCase()
        );

    update();

}


function alternate(){

    text.value =
        [...text.value]
        .map(
            (c,i) =>
            i % 2
            ? c.toLowerCase()
            : c.toUpperCase()
        )
        .join("");

    update();

}


function copyText(){

    if(!text.value){

        return;

    }

    navigator.clipboard
        .writeText(text.value);

}


function clearText(){

    text.value="";

    update();

}


function update(){

    const value =
        text.value.trim();


    document
        .getElementById("words")
        .textContent =
        "Words: " +
        (
            value
            ? value.split(/\s+/).length
            : 0
        );


    document
        .getElementById("chars")
        .textContent =
        "Characters: " +
        text.value.length;

}


text.addEventListener(
    "input",
    update
);

</script>
