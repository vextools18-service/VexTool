<body>

<div class="container">

<h1>💰 Loan Calculator</h1>

<p>
Estimate monthly loan payments.
</p>

<input
id="amount"
type="number"
placeholder="Loan Amount"
>

<input
id="rate"
type="number"
placeholder="Annual Interest Rate (%)"
>

<input
id="months"
type="number"
placeholder="Loan Term (Months)"
>

<button onclick="calculate()">
Calculate
</button>

<div class="result" id="result">
Result
</div>

</div>

<script>

function calculate(){

let P =
Number(document.getElementById("amount").value);

let annual =
Number(document.getElementById("rate").value);

let n =
Number(document.getElementById("months").value);

if(!P || !n || annual < 0){

document.getElementById("result").textContent =
"Enter valid values.";

return;

}

let r =
annual / 100 / 12;

let payment =
r === 0
? P / n
: P * r * Math.pow(1+r,n) /
  (Math.pow(1+r,n)-1);

let total =
payment * n;

document.getElementById("result").innerHTML =
"Monthly Payment: " +
payment.toFixed(2) +

"<br>Total Payment: " +
total.toFixed(2) +

"<br>Total Interest: " +
(total-P).toFixed(2);

}

</script>
