<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temperature Converter — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:50px 20px}
.container{max-width:600px;margin:auto}
input,select{width:100%;padding:15px;margin:8px 0;background:#111a30;color:white;border:1px solid #27304a;border-radius:10px}
button{width:100%;padding:15px;background:#7c3aed;color:white;border:0;border-radius:10px}
.result{margin-top:20px;padding:20px;background:#111a30;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>🌡️ Temperature Converter</h1>
<p>Convert Celsius, Fahrenheit and Kelvin.</p>
<input id="value" type="number" placeholder="Temperature">

<select id="from">
<option value="c">Celsius</option>
<option value="f">Fahrenheit</option>
<option value="k">Kelvin</option>
</select>

<select id="to">
<option value="f">Fahrenheit</option>
<option value="c">Celsius</option>
<option value="k">Kelvin</option>
</select>

<button onclick="convert()">Convert</button>
<div class="result" id="result">Result</div>
</div>

<script>
function convert(){
let v=Number(value.value);
let c;

if(from.value==="c")c=v;
if(from.value==="f")c=(v-32)*5/9;
if(from.value==="k")c=v-273.15;

let answer;
if(to.value==="c")answer=c;
if(to.value==="f")answer=c*9/5+32;
if(to.value==="k")answer=c+273.15;

result.textContent=answer.toFixed(2);
}
</script>
</body>
</html>
