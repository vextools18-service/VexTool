<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#070b18;
    color:white;
    min-height:100vh;
    padding:50px 20px;
}

.container{
    max-width:600px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    display:inline-block;
    color:#a78bfa;
    font-size:28px;
    font-weight:900;
    text-decoration:none;
    margin-bottom:10px;
}

h1{
    margin:10px 0 8px;
    font-size:36px;
}

.header p{
    color:#94a3b8;
    line-height:1.6;
}

.card{
    background:rgba(17,25,45,.85);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:22px;
}

input,
select{
    width:100%;
    padding:15px;
    margin:8px 0;
    background:#111a30;
    color:white;
    border:1px solid #27304a;
    border-radius:10px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#7c3aed;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    background:#7c3aed;
    color:white;
    border:0;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.result{
    margin-top:20px;
    padding:20px;
    background:#111a30;
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#22d3ee;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.info{
    margin-top:20px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
    text-align:center;
}

@media(max-width:500px){

    body{
        padding:30px 15px;
    }

    h1{
        font-size:29px;
    }

<body>

<main class="container">

    <header class="header">

        <a
            class="logo"
            href="../index.html"
            aria-label="VexTools Home"
        >
            VexTools
        </a>

        <h1>🌡️ Temperature Converter</h1>

        <p>
            Convert temperatures between Celsius, Fahrenheit,
            and Kelvin quickly and accurately.
        </p>

    </header>


    <section class="card" aria-label="Temperature Converter">

        <input
            id="value"
            type="number"
            placeholder="Enter temperature"
            aria-label="Temperature value"
        >


        <select
            id="from"
            aria-label="Convert from"
        >

            <option value="c">
                Celsius
            </option>

            <option value="f">
                Fahrenheit
            </option>

            <option value="k">
                Kelvin
            </option>

        </select>


        <select
            id="to"
            aria-label="Convert to"
        >

            <option value="f">
                Fahrenheit
            </option>

            <option value="c">
                Celsius
            </option>

            <option value="k">
                Kelvin
            </option>

        </select>


        <button
            type="button"
            onclick="convert()"
        >
            Convert Temperature
        </button>


        <div
            class="result"
            id="result"
            aria-live="polite"
        >
            Result
        </div>


        <p class="info">
            Convert Celsius (°C), Fahrenheit (°F), and Kelvin (K)
            directly in your browser.
        </p>

    </section>

</main>


<script>

function convert(){

    const v =
        Number(document.getElementById("value").value);

    const from =
        document.getElementById("from").value;

    const to =
        document.getElementById("to").value;

    const result =
        document.getElementById("result");


    if(!Number.isFinite(v)){

        result.textContent =
            "Please enter a valid temperature.";

        return;

    }


    let c;


    /* Convert input to Celsius */

    if(from === "c"){
        c = v;
    }

    else if(from === "f"){
        c = (v - 32) * 5 / 9;
    }

    else if(from === "k"){
        c = v - 273.15;
    }


    /* Convert Celsius to target */

    let answer;


    if(to === "c"){
        answer = c;
    }

    else if(to === "f"){
        answer = c * 9 / 5 + 32;
    }

    else if(to === "k"){
        answer = c + 273.15;
    }


    const symbols = {
        c: "°C",
        f: "°F",
        k: "K"
    };


    result.textContent =
        answer.toFixed(2) + " " + symbols[to];

}

</script>

</body>
