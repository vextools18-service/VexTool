<body>

<div class="container">

<div class="header">

<a class="logo" href="../index.html">
VexTools
</a>

<h1>
JPG to PNG
</h1>

<p>
Convert JPG images to PNG format online for free.
</p>

</div>

<div class="card">

<input
id="file"
type="file"
accept="image/jpeg,image/jpg"
>

<button onclick="convert()">
Convert to PNG
</button>

</div>

</div>

<script>

function convert(){

const file =
document.getElementById("file").files[0];

if(!file){

alert("Please select a JPG image.");

return;

}

const img =
new Image();

img.onload = ()=>{

const canvas =
document.createElement("canvas");

canvas.width =
img.width;

canvas.height =
img.height;

canvas
.getContext("2d")
.drawImage(
img,
0,
0
);

canvas.toBlob(blob=>{

const url =
URL.createObjectURL(blob);

const old =
document.querySelector(".download");

if(old)
old.remove();

const link =
document.createElement("a");

link.className =
"download";

link.href =
url;

link.download =
"converted-image.png";

link.textContent =
"Download PNG";

document
.querySelector(".card")
.appendChild(link);

},"image/png");

};

img.src =
URL.createObjectURL(file);

}

</script>
