<body>

<div class="container">

<h1>🎂 Age Calculator</h1>

<p>
Calculate your exact age quickly and easily using your date of birth.
</p>


<input
id="dob"
type="date"
aria-label="Enter your date of birth"
>


<button onclick="calculate()">
Calculate Age
</button>


<div class="result" id="result" aria-live="polite">
Your age will appear here.
</div>


<a class="back" href="../index.html">
← Back to VexTools
</a>

</div>


<script>

function calculate(){

const dobInput = document.getElementById("dob");

const result = document.getElementById("result");

if(!dobInput.value){

result.textContent =
"Please select your date of birth.";

return;

}


const birth = new Date(dobInput.value);

const today = new Date();


if(birth > today){

result.textContent =
"Please select a valid date of birth.";

return;

}


let age =
today.getFullYear() -
birth.getFullYear();


const month =
today.getMonth() -
birth.getMonth();


if(
month < 0 ||
(month === 0 &&
today.getDate() < birth.getDate())
){

age--;

}


result.textContent =
"Your age is " + age + " years.";

}

</script>
