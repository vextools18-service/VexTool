<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speed Converter — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:50px 20px}
.container{max-width:600px;margin:auto}
input,select{width:100%;padding:15px;margin:8px 0;background:#111a30;color:white;border:1px solid #27304a;border-radius:10px}
button{width:100%;padding:15px;background:#7c3aed;color:white;border:0;border-radius:10px}
.result{margin-top:20px;padding:20px;background:#111a30;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>🚗 Speed Converter</h1>
<p>Convert between km/h and mph.</p>
<input id="value" type="number" placeholder="Speed">

<select id="from">
<option value="kmh">KM/H</option>
<option value="mph">MPH</option>
</select>

<select id="to">
<option value="mph">MPH</option>
<option value="kmh">KM/H</option>
</select>

<button onclick="convert()">Convert</button>
<div class="result" id="result">Result</div>
</div>

<script>
function convert(){
let v=Number(value.value);
let answer;

if(from.value==="kmh"&&to.value==="mph")answer=v*0.621371;
else if(from.value==="mph"&&to.value==="kmh")answer=v*1.60934;
else answer=v;

result.textContent=answer.toFixed(4);
}
</script>
</body>
</html>
