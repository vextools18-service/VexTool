<style>
body{
font-family:Arial;
background:#070b18;
color:white;
padding:50px 20px
}

.container{
max-width:600px;
margin:auto
}

input,select{
width:100%;
padding:15px;
margin:8px 0;
background:#111a30;
color:white;
border:1px solid #27304a;
border-radius:10px
}

button{
width:100%;
padding:15px;
background:#7c3aed;
color:white;
border:0;
border-radius:10px;
font-weight:bold;
cursor:pointer
}

.result{
margin-top:20px;
padding:20px;
background:#111a30;
border-radius:10px;
font-size:20px
}
</style>
</head>

<body>

<div class="container">

<h1>🚗 Speed Converter</h1>

<p>
Convert between kilometers per hour (KM/H) and miles per hour (MPH).
</p>

<input
id="value"
type="number"
placeholder="Enter speed"
aria-label="Enter speed"
>

<select id="from" aria-label="Convert from">

<option value="kmh">
KM/H
</option>

<option value="mph">
MPH
</option>

</select>

<select id="to" aria-label="Convert to">

<option value="mph">
MPH
</option>

<option value="kmh">
KM/H
</option>

</select>

<button onclick="convert()">
Convert
</button>

<div class="result" id="result">
Result
</div>

</div>

<script>

function convert(){

let v=Number(
document.getElementById("value").value
);

let from=document.getElementById("from").value;
let to=document.getElementById("to").value;

if(!Number.isFinite(v)){

document.getElementById("result").textContent=
"Enter a valid speed.";

return;

}

let answer;

if(from==="kmh" && to==="mph"){

answer=v*0.621371;

}
else if(from==="mph" && to==="kmh"){

answer=v*1.60934;

}
else{

answer=v;

}

document.getElementById("result").textContent=
answer.toFixed(4);

}

</script>

</body>
