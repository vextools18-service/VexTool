<body>

<div class="container">

<h1>🎲 Random Number Generator</h1>

<p>
Generate a random number between your chosen range.
</p>

<input
id="min"
type="number"
placeholder="Minimum"
>

<input
id="max"
type="number"
placeholder="Maximum"
>

<button onclick="generate()">
Generate
</button>

<div class="result" id="result">
?
</div>

</div>

<script>

function generate(){

let a=Number(document.getElementById("min").value);
let b=Number(document.getElementById("max").value);

if(!Number.isFinite(a)||!Number.isFinite(b)){
document.getElementById("result").textContent="Enter valid numbers.";
return;
}

if(a>b)[a,b]=[b,a];

document.getElementById("result").textContent=
Math.floor(Math.random()*(b-a+1))+a;

}

</script>
