<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Picker — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:40px 20px}
.container{max-width:650px;margin:auto;text-align:center}
input[type=color]{width:180px;height:180px;border:0;background:none;cursor:pointer;margin:30px}
.box{padding:25px;background:#111a30;border-radius:15px}
button{padding:13px 25px;background:#7c3aed;color:white;border:0;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h1>🎨 Color Picker</h1>
<p>Pick a color and get its HEX and RGB values.</p>

<input id="color" type="color" value="#7c3aed">

<div class="box">
<h2 id="hex">#7C3AED</h2>
<p id="rgb">RGB: 124, 58, 237</p>
<button onclick="copyHex()">Copy HEX</button>
</div>
</div>

<script>
color.addEventListener("input",update);

function update(){
let c=color.value.toUpperCase();
hex.textContent=c;

let r=parseInt(c.slice(1,3),16);
let g=parseInt(c.slice(3,5),16);
let b=parseInt(c.slice(5,7),16);

rgb.textContent=`RGB: ${r}, ${g}, ${b}`;
}

function copyHex(){
navigator.clipboard.writeText(color.value);
alert("HEX copied!");
}
</script>
</body>
</html>
