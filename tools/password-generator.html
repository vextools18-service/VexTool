<style>
*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial;
background:#070b18;
color:#f8fafc;
min-height:100vh;
padding:40px 20px
}

.container{
max-width:700px;

}

h1{
text-align:center;
margin-bottom:10px
}

p{
text-align:center;

}

.box{
background:#111a30;
border:1px solid #27304a;
border-radius:18px;
padding:25px;
margin-top:30px
}

input[type=number]{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #27304a;
background:#070b18;
color:white;
margin:10px 0 20px
}

label{
display:block;
margin:12px 0
}

button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(124,58,237,.3)
}

.result{
margin-top:20px;
padding:18px;
background:#070b18;
border-radius:10px;
word-break:break-all;

color:#22d3ee
}

<body>

<div class="container">

<h1>🔐 Password Generator</h1>

<p>
Generate a strong random password online for free.
</p>

<div class="box">

<label>
Password Length
</label>

<input
id="length"
type="number"
min="4"
max="100"
value="16"
>

<label>
<input
id="upper"
type="checkbox"
checked
>
Uppercase
</label>

<label>
<input
id="lower"
type="checkbox"
checked
>
Lowercase
</label>

<label>
<input
id="numbers"
type="checkbox"
checked
>
Numbers
</label>

<label>
<input
id="symbols"
type="checkbox"
checked
>
Symbols
</label>

<button onclick="generate()">
Generate Password
</button>

<div
class="result"
id="result"
>
Your password will appear here.
</div>

<button onclick="copyPassword()">
Copy Password
</button>

</div>

</div>

<script>

function generate(){

let chars="";

if(
document.getElementById("upper").checked
)
chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

if(
document.getElementById("lower").checked
)
chars+="abcdefghijklmnopqrstuvwxyz";

if(
document.getElementById("numbers").checked
)
chars+="0123456789";

if(
document.getElementById("symbols").checked
)
chars+="!@#$%^&*()_+-=[]{}";

const result =
document.getElementById("result");

if(!chars){

result.textContent =
"Select at least one option.";

return;

}

let out="";

let len =
Math.min(
100,
Math.max(
4,
Number(
document.getElementById("length").value
) || 16
)
);

for(
let i=0;
i<len;
i++
){

out +=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

result.textContent=out;

}


function copyPassword(){

const password =
document.getElementById("result").textContent;

if(
!password ||
password==="Your password will appear here."
){

return;

}

navigator.clipboard.writeText(password);

alert("Password copied!");

}

</script>
