<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — VexTools</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#070b18;color:#f8fafc;min-height:100vh;padding:40px 20px}
.container{max-width:700px;margin:auto}
h1{text-align:center;margin-bottom:10px}
p{text-align:center;color:#94a3b8}
.box{background:#111a30;border:1px solid #27304a;border-radius:18px;padding:25px;margin-top:30px}
input[type=number]{width:100%;padding:14px;border-radius:10px;border:1px solid #27304a;background:#070b18;color:white;margin:10px 0 20px}
label{display:block;margin:12px 0}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:bold;cursor:pointer;margin-top:10px}
.result{margin-top:20px;padding:18px;background:#070b18;border-radius:10px;word-break:break-all;font-family:monospace;color:#22d3ee}
</style>
</head>
<body>
<div class="container">
<h1>🔐 Password Generator</h1>
<p>Generate a strong random password.</p>

<div class="box">
<label>Password Length</label>
<input id="length" type="number" min="4" max="100" value="16">

<label><input id="upper" type="checkbox" checked> Uppercase</label>
<label><input id="lower" type="checkbox" checked> Lowercase</label>
<label><input id="numbers" type="checkbox" checked> Numbers</label>
<label><input id="symbols" type="checkbox" checked> Symbols</label>

<button onclick="generate()">Generate Password</button>
<div class="result" id="result">Your password will appear here.</div>
<button onclick="copyPassword()">Copy Password</button>
</div>
</div>

<script>
function generate(){
let chars="";
if(upper.checked)chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
if(lower.checked)chars+="abcdefghijklmnopqrstuvwxyz";
if(numbers.checked)chars+="0123456789";
if(symbols.checked)chars+="!@#$%^&*()_+-=[]{}";
if(!chars)return result.textContent="Select at least one option.";

let out="";
let len=Math.min(100,Math.max(4,Number(length.value)||16));

for(let i=0;i<len;i++){
out+=chars[Math.floor(Math.random()*chars.length)];
}
result.textContent=out;
}

function copyPassword(){
navigator.clipboard.writeText(result.textContent);
alert("Password copied!");
}
</script>
</body>
</html>
