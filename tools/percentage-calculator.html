<style>
body{font-family:Arial;background:#070b18;color:white;padding:40px 20px}
.container{max-width:600px;margin:auto}
input{width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #27304a;background:#111a30;color:white}
button{width:100%;padding:15px;margin-top:10px;background:#7c3aed;color:white;border:0;border-radius:10px;font-weight:bold;cursor:pointer}

<body>

<div class="container">

<h1>📊 Percentage Calculator</h1>

<p>Calculate percentages quickly and easily.</p>

<input id="percent" type="number" placeholder="Percentage">

<input id="number" type="number" placeholder="Number">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result">
Result: —
</div>

</div>

<script>
function calculate(){

let p=Number(document.getElementById("percent").value);
let n=Number(document.getElementById("number").value);

if(isNaN(p)||isNaN(n)){
document.getElementById("result").textContent="Please enter valid numbers.";
return;
}

document.getElementById("result").textContent=
"Result: "+(p/100*n);

}
</script>
