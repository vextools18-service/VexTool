<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percentage Calculator — VexTools</title>
<style>
body{font-family:Arial;background:#070b18;color:white;padding:40px 20px}
.container{max-width:600px;margin:auto}
input{width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #27304a;background:#111a30;color:white}
button{width:100%;padding:15px;margin-top:10px;background:#7c3aed;color:white;border:0;border-radius:10px;font-weight:bold}
.result{margin-top:20px;padding:20px;background:#111a30;border-radius:12px;font-size:20px}
</style>
</head>
<body>
<div class="container">
<h1>📊 Percentage Calculator</h1>
<p>Calculate percentages quickly.</p>
<input id="percent" type="number" placeholder="Percentage">
<input id="number" type="number" placeholder="Number">
<button onclick="calculate()">Calculate</button>
<div class="result" id="result">Result: —</div>
</div>
<script>
function calculate(){
let p=Number(percent.value),n=Number(number.value);
result.textContent="Result: "+(p/100*n);
}
</script>
</body>
</html>
