<div class="container">

<p>

</p>

</div>

<div class="card">

<div class="controls">

<input
id="count"
type="number"
min="1"
max="100"
value="3"
>

<button onclick="generate()">
Generate
</button>

<button onclick="copyText()">
Copy
</button>

</div>

<textarea
id="output"
readonly
placeholder="Generated Lorem Ipsum will appear here..."
></textarea>

</div>

</div>

<script>

const words =
`lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum`
.split(" ");


function generate(){

let paragraphs=[];

let count =
Math.min(
100,
Math.max(
1,
Number(
document.getElementById("count").value
)
)
);


for(
let p=0;
p<count;
p++
){

let sentence=[];

for(
let i=0;
i<45;
i++
){

sentence.push(
words[
Math.floor(
Math.random()*words.length
)
]
);

}

let text =
sentence.join(" ");

text =
text.charAt(0).toUpperCase()
+
text.slice(1)
+
".";

paragraphs.push(text);

}


document.getElementById("output").value =
paragraphs.join("\n\n");

}


function copyText(){

const output =
document.getElementById("output");

if(!output.value){
return;
}

navigator.clipboard.writeText(
output.value
);

}


generate();

</script>
