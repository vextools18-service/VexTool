<div class="container">

Lorem Ipsum Generator

<p>
Generate placeholder text instantly.
</p>

</div>

<div class="card">

<div class="controls">

<input
id="count"
type="number"
min="1"
max="100"
value="3"
aria-label="Number of paragraphs"
>

<button type="button" onclick="generate()">
Generate
</button>

<button type="button" onclick="copyText()">
Copy
</button>

</div>

<textarea
id="output"
readonly
placeholder="Generated Lorem Ipsum will appear here..."
aria-label="Generated Lorem Ipsum"
></textarea>

<div id="status" class="status"></div>

</div>

</div>

<script>

const words = `
lorem ipsum dolor sit amet consectetur adipiscing elit
sed do eiusmod tempor incididunt ut labore et dolore magna
aliqua ut enim ad minim veniam quis nostrud exercitation
ullamco laboris nisi ut aliquip ex ea commodo consequat
duis aute irure dolor in reprehenderit voluptate velit esse
cillum dolore eu fugiat nulla pariatur excepteur sint occaecat
cupidatat non proident sunt culpa qui officia deserunt mollit
anim id est laborum
`.trim().split(/\s+/);

function generate(){

const countInput =
document.getElementById("count");

const output =
document.getElementById("output");

const status =
document.getElementById("status");

let count =
parseInt(countInput.value,10);

if(isNaN(count)){
count = 3;
}

count =
Math.min(100,Math.max(1,count));

countInput.value = count;

const paragraphs = [];

for(let p=0;p<count;p++){

const sentence = [];

for(let i=0;i<45;i++){

sentence.push(
words[Math.floor(Math.random()*words.length)]
);

}

let text = sentence.join(" ");

text =
text.charAt(0).toUpperCase() +
text.slice(1) +
".";

paragraphs.push(text);

}

output.value =
paragraphs.join("\n\n");

status.textContent =
count === 1
? "1 paragraph generated."
: count + " paragraphs generated.";

}

async function copyText(){

const output =
document.getElementById("output");

const status =
document.getElementById("status");

if(!output.value){

status.textContent =
"Generate some text first.";

return;

}

try{

await navigator.clipboard.writeText(
output.value
);

status.textContent =
"✓ Text copied successfully!";

}catch(error){

output.select();
document.execCommand("copy");

status.textContent =
"✓ Text copied successfully!";

}

}

generate();

</script>
