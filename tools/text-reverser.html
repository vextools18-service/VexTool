<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#070b18;
color:white;
padding:30px 15px;
min-height:100vh;
}

.container{
max-width:850px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:25px;
}

.logo{
display:inline-block;
color:#a78bfa;
font-size:28px;
font-weight:900;
text-decoration:none;
margin-bottom:5px;
}

h1{
margin:15px 0 8px;
font-size:36px;
}

.header p{
color:#94a3b8;
line-height:1.6;
}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

textarea{
width:100%;
height:220px;
padding:18px;
border-radius:14px;
border:1px solid #29344f;
background:#0d1427;
color:white;
font-size:16px;
resize:vertical;
outline:none;
line-height:1.6;
}

textarea:focus{
border-color:#7c3aed;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

button{
flex:1;
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.info{
margin-top:18px;
text-align:center;
color:#94a3b8;
font-size:13px;
line-height:1.6;
}

@media(max-width:600px){

.buttons{
flex-direction:column;
}

h1{
font-size:29px;
}

}

</style>

</head>


<body>

<main class="container">

<header class="header">

<a
class="logo"
href="../index.html"
aria-label="VexTools Home"
>
VexTools
</a>

<h1>Text Reverser</h1>

<p>
Reverse your text instantly with this free online text reverser.
</p>

</header>


<section
class="card"
aria-label="Text Reverser Tool"
>

<textarea
id="input"
placeholder="Enter text here..."
aria-label="Text to reverse"
></textarea>


<div class="buttons">

<button
type="button"
onclick="reverseText()"
>
Reverse Text
</button>

<button
type="button"
onclick="copyText()"
>
Copy
</button>

<button
type="button"
onclick="clearText()"
>
Clear
</button>

</div>


<p class="info">
Reverse text directly in your browser. No text is uploaded to a server.
</p>

</section>

</main>


<script>

function reverseText(){

const input =
document.getElementById("input");

input.value =
[...input.value]
.reverse()
.join("");

}


function copyText(){

const input =
document.getElementById("input");

if(!input.value){
return;
}

navigator.clipboard.writeText(
input.value
);

}


function clearText(){

document.getElementById("input").value = "";

}

</script>

</body>
