<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Reverser — VexTools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#070b18;
color:white;
padding:30px 15px;
}

.container{
max-width:850px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:25px;
}

.logo{
color:#a78bfa;
font-size:28px;
font-weight:900;
text-decoration:none;
}

h1{margin:15px 0 8px}

.header p{color:#94a3b8}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

textarea{
width:100%;
height:220px;
padding:18px;
border-radius:14px;
border:1px solid #29344f;
background:#0d1427;
color:white;
font-size:16px;
resize:vertical;
outline:none;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

button{
flex:1;
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;
font-weight:bold;
cursor:pointer;
}

@media(max-width:600px){
.buttons{flex-direction:column}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>
<h1>Text Reverser</h1>
<p>Reverse your text instantly.</p>
</div>

<div class="card">

<textarea id="input" placeholder="Enter text here..."></textarea>

<div class="buttons">
<button onclick="reverseText()">Reverse Text</button>
<button onclick="copyText()">Copy</button>
<button onclick="clearText()">Clear</button>
</div>

</div>
</div>

<script>
function reverseText(){
const input=document.getElementById("input");
input.value=[...input.value].reverse().join("");
}

function copyText(){
navigator.clipboard.writeText(document.getElementById("input").value);
}

function clearText(){
document.getElementById("input").value="";
}
</script>

</body>
</html>
