<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#070b18;
    color:white;
    padding:30px 15px;
    min-height:100vh;
}

.container{
    max-width:850px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    display:inline-block;
    color:#a78bfa;
    font-size:28px;
    font-weight:900;
    text-decoration:none;
    margin-bottom:5px;
}

h1{
    margin:15px 0 8px;
    font-size:36px;
}

.header p{
    color:#94a3b8;
    line-height:1.6;
}

.card{
    background:rgba(17,25,45,.85);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:22px;
}

textarea{
    width:100%;
    height:300px;
    padding:18px;
    background:#0d1427;
    color:white;
    border:1px solid #29344f;
    border-radius:14px;
    resize:vertical;
    outline:none;
    line-height:1.6;
    font-size:16px;
}

textarea:focus{
    border-color:#7c3aed;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

button{
    padding:13px;
    border:0;
    border-radius:10px;
    background:linear-gradient(90deg,#7c3aed,#6366f1);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.info{
    margin-top:18px;
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
}

@media(max-width:600px){

    .buttons{
        grid-template-columns:1fr;
    }

    h1{
        font-size:29px;
    }

}

</style>

</head>


<body>

<main class="container">

    <header class="header">

        <a
            class="logo"
            href="../index.html"
            aria-label="VexTools Home"
        >
            VexTools
        </a>

        <h1>Text Cleaner</h1>

        <p>
            Quickly clean and normalize your text online.
        </p>

    </header>


    <section
        class="card"
        aria-label="Text Cleaner Tool"
    >

        <textarea
            id="text"
            placeholder="Paste text here..."
            aria-label="Text to clean"
        ></textarea>


        <div class="buttons">

            <button
                type="button"
                onclick="trimLines()"
            >
                Trim Lines
            </button>

            <button
                type="button"
                onclick="removeEmpty()"
            >
                Remove Empty Lines
            </button>

            <button
                type="button"
                onclick="spaces()"
            >
                Fix Spaces
            </button>

            <button
                type="button"
                onclick="allClean()"
            >
                Clean Everything
            </button>

            <button
                type="button"
                onclick="copyText()"
            >
                Copy
            </button>

            <button
                type="button"
                onclick="clearText()"
            >
                Clear
            </button>

        </div>


        <p class="info">
            Clean your text directly in your browser.
            No text is uploaded to a server.
        </p>

    </section>

</main>


<script>

const box =
    document.getElementById("text");


/* =========================
   TRIM LINES
========================= */

function trimLines(){

    box.value =
        box.value
        .split(/\r?\n/)
        .map(x => x.trim())
        .join("\n");

}


/* =========================
   REMOVE EMPTY LINES
========================= */

function removeEmpty(){

    box.value =
        box.value
        .split(/\r?\n/)
        .filter(x => x.trim())
        .join("\n");

}


/* =========================
   FIX SPACES
========================= */

function spaces(){

    box.value =
        box.value
        .replace(/[ \t]+/g," ");

}


/* =========================
   CLEAN EVERYTHING
========================= */

function allClean(){

    removeEmpty();

    trimLines();

    spaces();

    box.value =
        box.value.trim();

}


/* =========================
   COPY
========================= */

function copyText(){

    if(!box.value){
        return;
    }

    navigator.clipboard
        .writeText(box.value);

}


/* =========================
   CLEAR
========================= */

function clearText(){

    box.value = "";

}

</script>

</body>

</html>
