<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Cropper — VexTools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#070b18;
color:white;
padding:30px 15px;
}

.container{max-width:850px;margin:auto}

.header{text-align:center;margin-bottom:25px}

.logo{
color:#a78bfa;
font-size:28px;
font-weight:900;
text-decoration:none;
}

h1{margin:15px 0 8px}

p{color:#94a3b8}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

input{
width:100%;
padding:14px;
background:#0d1427;
color:white;
border-radius:10px;
border:1px solid #29344f;
}

canvas{
display:block;
max-width:100%;
margin:20px auto;
background:#111827;
border-radius:10px;
}

button{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;
font-weight:bold;
cursor:pointer;
}

.download{
display:block;
margin-top:15px;
text-align:center;
padding:13px;
border-radius:10px;
background:#06b6d4;
color:white;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>
<h1>Image Cropper</h1>
<p>Crop an image directly in your browser.</p>
</div>

<div class="card">

<input id="file" type="file" accept="image/*">

<canvas id="canvas"></canvas>

<button onclick="crop()">Crop Center</button>

</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let img=null;

document.getElementById("file").addEventListener("change",e=>{

const file=e.target.files[0];

if(!file)return;

img=new Image();

img.onload=()=>{

const size=Math.min(img.width,img.height);

canvas.width=size;
canvas.height=size;

ctx.drawImage(
img,
(img.width-size)/2,
(img.height-size)/2,
size,
size,
0,
0,
size,
size
);

};

img.src=URL.createObjectURL(file);

});

function crop(){

if(!img){
alert("Please select an image.");
return;
}

const size=Math.min(img.width,img.height);

canvas.width=size;
canvas.height=size;

ctx.drawImage(
img,
(img.width-size)/2,
(img.height-size)/2,
size,
size,
0,
0,
size,
size
);

canvas.toBlob(blob=>{

const url=URL.createObjectURL(blob);

const old=document.querySelector(".download");
if(old)old.remove();

const link=document.createElement("a");

link.className="download";
link.href=url;
link.download="cropped-image.png";
link.textContent="Download Cropped Image";

document.querySelector(".card").appendChild(link);

},"image/png");

}
</script>

</body>
</html>
