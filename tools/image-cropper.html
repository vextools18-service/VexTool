font-family:Arial,sans-serif;

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

input{
width:100%;
padding:14px;
background:#0d1427;
color:white;
border-radius:10px;
border:1px solid #29344f;
}

canvas{
display:block;
max-width:100%;

background:#111827;

}

button{
width:100%;
padding:13px;
border:0;

background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;

cursor:pointer;
}

.download{
display:block;
margin-top:15px;

color:white;

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>

<h1>Image Cropper</h1>

<p>
Crop images online for free directly in your browser.
</p>
</div>

<div class="card">

<input id="file" type="file" accept="image/*">

<canvas id="canvas"></canvas>

<button onclick="crop()">
Crop Center
</button>

</div>
</div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let img = null;

let imageURL = null;
let downloadURL = null;


document
.getElementById("file")
.addEventListener("change",e=>{

const file =
e.target.files[0];

if(!file) return;

if(imageURL){
URL.revokeObjectURL(imageURL);
}

img = new Image();

imageURL =
URL.createObjectURL(file);

img.onload = ()=>{

const size =
Math.min(
img.width,
img.height
);

canvas.width = size;
canvas.height = size;

ctx.drawImage(
img,
(img.width-size)/2,
(img.height-size)/2,
size,
size,
0,
0,
size,
size
);

};

img.src = imageURL;

});


function crop(){

if(!img){
alert("Please select an image.");
return;
}

const size =
Math.min(
img.width,
img.height
);

canvas.width = size;
canvas.height = size;

ctx.drawImage(
img,
(img.width-size)/2,
(img.height-size)/2,
size,
size,
0,
0,
size,
size
);

canvas.toBlob(blob=>{

if(!blob) return;

if(downloadURL){
URL.revokeObjectURL(downloadURL);
}

downloadURL =
URL.createObjectURL(blob);

const old =
document.querySelector(".download");

if(old) old.remove();

const link =
document.createElement("a");

link.className =
"download";

link.href =
downloadURL;

link.download =
"cropped-image.png";

link.textContent =
"Download Cropped Image";

document
.querySelector(".card")
.appendChild(link);

},"image/png");

}

</script>

</body>
