<body>

<div class="container">

<h1>⚖️ BMI Calculator</h1>

<p>
Calculate your BMI from your height and weight instantly.
</p>


<div class="form">

<label for="weight">
Weight (kg)
</label>

<input
id="weight"
type="number"
min="0.1"
step="0.1"
inputmode="decimal"
placeholder="Enter your weight in kg"
aria-label="Weight in kilograms"
>


<label for="height">
Height (cm)
</label>

<input
id="height"
type="number"
min="0.1"
step="0.1"
inputmode="decimal"
placeholder="Enter your height in cm"
aria-label="Height in centimeters"
>


<button
type="button"
onclick="calculateBMI()">
Calculate BMI
</button>

</div>


<div
class="result"
id="result"
aria-live="polite">
Enter your height and weight to calculate BMI.
</div>


<p class="note">
BMI is a general mathematical measure and is not a diagnosis or a substitute for professional health advice.
</p>


<a class="back" href="../index.html">
← Back to VexTools
</a>

</div>


<script>

const weightInput =
document.getElementById("weight");

const heightInput =
document.getElementById("height");

const result =
document.getElementById("result");


function calculateBMI(){

const weight =
Number(weightInput.value);

const heightCm =
Number(heightInput.value);


result.classList.remove(
"success",
"error"
);


if(
!Number.isFinite(weight) ||
!Number.isFinite(heightCm) ||
weight <= 0 ||
heightCm <= 0
){

result.textContent =
"Please enter valid height and weight values.";

result.classList.add("error");

return;

}


const heightMeters =
heightCm / 100;


const bmi =
weight /
(heightMeters * heightMeters);


if(
!Number.isFinite(bmi) ||
bmi <= 0
){

result.textContent =
"Unable to calculate BMI. Please check your values.";

result.classList.add("error");

return;

}


result.textContent =
"BMI: " + bmi.toFixed(2);

result.classList.add("success");

}


/* Allow Enter key to calculate */

weightInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){
calculateBMI();
}

});


heightInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){
calculateBMI();
}

});

</script>
