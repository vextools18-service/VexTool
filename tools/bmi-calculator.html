<body>

<div class="container">

<h1>⚖️ BMI Calculator</h1>

<p>
Calculate your BMI from your height and weight instantly.
</p>


<input
id="weight"
type="number"
min="0"
step="0.1"
placeholder="Weight (kg)"
aria-label="Weight in kilograms"
>


<input
id="height"
type="number"
min="0"
step="0.1"
placeholder="Height (cm)"
aria-label="Height in centimeters"
>


<button onclick="calculate()">
Calculate BMI
</button>


<div
class="result"
id="result"
aria-live="polite"
>
Result
</div>


<a class="back" href="../index.html">
← Back to VexTools
</a>

</div>


<script>

function calculate(){

const w =
Number(document.getElementById("weight").value);

const hCm =
Number(document.getElementById("height").value);


if(!w || !hCm || w <= 0 || hCm <= 0){

document.getElementById("result").textContent =
"Please enter valid height and weight values.";

return;

}


const h =
hCm / 100;

const bmi =
w / (h * h);


document.getElementById("result").textContent =
"BMI: " + bmi.toFixed(2);

}

</script>
