button{
width:100%;

}

.download{
display:block;
margin-top:15px;

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>

<h1>PNG to JPG Converter</h1>

<p>Convert PNG images to JPG online for free.</p>
</div>

<div class="card">

<input id="file" type="file" accept="image/png">

<button onclick="convert()">Convert to JPG</button>

</div>
</div>

<script>
function convert(){

const file=document.getElementById("file").files[0];

if(!file){
alert("Please select a PNG image.");
return;
}

const img=new Image();

img.onload=()=>{

const canvas=document.createElement("canvas");

canvas.width=img.width;
canvas.height=img.height;

const ctx=canvas.getContext("2d");

ctx.fillStyle="white";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);

canvas.toBlob(blob=>{

const url=URL.createObjectURL(blob);

const old=document.querySelector(".download");
if(old)old.remove();

const link=document.createElement("a");

link.className="download";
link.href=url;
link.download="converted-image.jpg";
link.textContent="Download JPG";

document.querySelector(".card").appendChild(link);

},"image/jpeg",.92);

};

img.src=URL.createObjectURL(file);
}
</script>
