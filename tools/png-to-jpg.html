<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PNG to JPG Converter — VexTools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#070b18;
color:white;
padding:30px 15px;
}

.container{max-width:750px;margin:auto}

.header{text-align:center;margin-bottom:25px}

.logo{
color:#a78bfa;
font-size:28px;
font-weight:900;
text-decoration:none;
}

h1{margin:15px 0 8px}

p{color:#94a3b8}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

input{
width:100%;
padding:15px;
background:#0d1427;
color:white;
border:1px solid #29344f;
border-radius:12px;
}

button{
width:100%;
margin-top:15px;
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;
font-weight:bold;
cursor:pointer;
}

.download{
display:block;
margin-top:15px;
padding:13px;
text-align:center;
background:#06b6d4;
color:white;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>
<h1>PNG to JPG</h1>
<p>Convert PNG images to JPG format.</p>
</div>

<div class="card">

<input id="file" type="file" accept="image/png">

<button onclick="convert()">Convert to JPG</button>

</div>
</div>

<script>
function convert(){

const file=document.getElementById("file").files[0];

if(!file){
alert("Please select a PNG image.");
return;
}

const img=new Image();

img.onload=()=>{

const canvas=document.createElement("canvas");

canvas.width=img.width;
canvas.height=img.height;

const ctx=canvas.getContext("2d");

ctx.fillStyle="white";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);

canvas.toBlob(blob=>{

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

link.className="download";
link.href=url;
link.download="converted-image.jpg";
link.textContent="Download JPG";

document.querySelector(".card").appendChild(link);

},"image/jpeg",.92);

};

img.src=URL.createObjectURL(file);
}
</script>

</body>
</html>
