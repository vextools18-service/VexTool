<style>

.header p{color:#94a3b8}

.card{
background:rgba(17,25,45,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:22px;
}

input[type=file]{
width:100%;
padding:15px;
background:#0d1427;

}

display:block;

}

input[type=range]{
width:100%;
}

button{
width:100%;
margin-top:18px;
padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#6366f1);
color:white;

}

button:hover{
opacity:.9;
}

margin-top:15px;
color:#94a3b8;
text-align:center;
}

a.download{
display:block;
margin-top:15px;
text-align:center;
padding:13px;

}

<body>

<div class="container">

<div class="header">
<a class="logo" href="../index.html">VexTools</a>

<h1>Image Compressor</h1>

<p>
Compress images online for free directly in your browser.
</p>
</div>

<div class="card">

<input id="file" type="file" accept="image/*">

<label>
Quality:
<span id="qualityValue">70%</span>
</label>

<input
id="quality"
type="range"
min="10"
max="100"
value="70"
>

<button onclick="compress()">
Compress Image
</button>

<div id="info"></div>

</div>
</div>

<script>

const quality =
document.getElementById("quality");

const qualityValue =
document.getElementById("qualityValue");

quality.addEventListener("input",()=>{
qualityValue.textContent =
quality.value+"%";
});


function compress(){

const file =
document.getElementById("file").files[0];

if(!file){
alert("Please select an image first.");
return;
}

const img = new Image();

const sourceURL =
URL.createObjectURL(file);

img.onload = ()=>{

const canvas =
document.createElement("canvas");

canvas.width =
img.width;

canvas.height =
img.height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0
);

canvas.toBlob(blob=>{

if(!blob){
document.getElementById("info").textContent =
"❌ Compression failed.";
URL.revokeObjectURL(sourceURL);
return;
}

const url =
URL.createObjectURL(blob);

const old =
document.querySelector(".download");

if(old){
URL.revokeObjectURL(old.href);
old.remove();
}

const link =
document.createElement("a");

link.className =
"download";

link.href =
url;

link.download =
"compressed-image.jpg";

link.textContent =
"Download Compressed Image";

document
.querySelector(".card")
.appendChild(link);

document.getElementById("info").textContent =
"Original: "+
format(file.size)+
" | Compressed: "+
format(blob.size);

URL.revokeObjectURL(sourceURL);

},
"image/jpeg",
Number(quality.value)/100
);

};

img.onerror = ()=>{
URL.revokeObjectURL(sourceURL);

document.getElementById("info").textContent =
"❌ Could not read the selected image.";
};

img.src =
sourceURL;

}


function format(bytes){

if(bytes < 1024)
return bytes+" B";

if(bytes < 1024*1024)
return (bytes/1024).toFixed(1)+" KB";

return (bytes/1024/1024).toFixed(2)+" MB";

}

</script>

</body>
